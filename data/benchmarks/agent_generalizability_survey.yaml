transfer_relevant_findings:
- Provides the four-level vocabulary (instruction/task/environment/domain) for labelling what an instrument-control
  benchmark's held-out split actually tests.
- Argues aggregate accuracy hides generalization gaps; recommends variance across task categories and cost of generality
  as reported metrics.
- Framework-level generality (e.g. ReAct) does not imply agent-level generality -- benchmark records should distinguish
  the two.
limitations:
- Survey; no empirical validation. Detailed ontology/metric definitions rest on a secondary digest.
