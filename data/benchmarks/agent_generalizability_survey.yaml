summary: |
  First comprehensive review of generalizability in LLM-based agents, defined as the ability to maintain consistent performance across varied instructions, tasks, environments and domains, especially beyond the agent's fine-tuning data. Situates generalizability within a hierarchical domain-task ontology, reviews datasets, evaluation dimensions and metrics (and their limitations), categorizes improvement methods (backbone LLM / agent components / their interactions), distinguishes generalizable frameworks from generalizable agents, and calls for standardized frameworks and variance- and cost-based metrics.
schema_axes_proposed:
- 'Generalization levels: instruction-level; task-level; environment-level; domain-level (hierarchical domain-task
  ontology; domains mapped to NAICS codes per secondary digest)'
- In-distribution vs beyond-fine-tuning-data performance
- 'Variance-based metric (sigma): performance disparity across task categories within a domain (secondary digest)'
- 'Cost-based metric: ''generalizability cost'' comparing specialist vs generalist agents (secondary digest)'
- Generalizable framework (prompting/RAG, no weight updates) vs generalizable agent (fine-tuned) distinction
- 'Method locus: backbone LLM / agent components (perception, memory) / component interactions (tool selection,
  retrieval, re-planning)'
- 'Recommendation: standardized evaluation frameworks; dynamic curricula in low-latency sandboxes'
