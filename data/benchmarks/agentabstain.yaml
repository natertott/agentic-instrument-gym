status: preprint
summary: |
  First systematic evaluation framework for agentic abstention -- the calibrated ability of tool-using LLM agents to recognize when NOT to act. Benchmark of 263 paired tasks in 42 executable MCP sandbox environments (541 tools), where each should-act task has a should-abstain twin differing by one controlled perturbation, so always-act or always-refuse policies cap at 50% paired accuracy. Generated by the AbstainGen pipeline (deterministic DAG replay + cross-family LLM critics; the generator itself is not open-sourced to limit contamination). Best of 17 frontier models (Gemini 3.1 Pro) reaches only 59.5% paired accuracy; abstention ability is largely independent of task-solving ability, and agents exhibit 'post-hoc abstention' (executing an irreversible action before recognizing the trigger).
schema_axes_proposed:
- Paired should-act / should-abstain task design with a single controlled perturbation
- 'Perturbation dimension: query/instruction (132 pairs); environment state (63); tool inventory (34); tool runtime
  behavior (34)'
- 'Abstention trigger timing: pre-execution (visible before any tool call) vs runtime (surfaces through tool returns)'
- 'Eight abstention scenarios: S1 missing critical parameter; S2 ambiguous action specification; S3 conflicting
  constraints; S4 high-stakes action; S5 insufficient tool capability; S6 critical tool failure; S7 conflicting
  evidence; S8 emergent risk discovery'
- 'Tool categories: lookup (read-only, 246); verify (validation gates, 119); commit (state-mutating, 176 = 155 write
  + 21 delete)'
- 'Metrics: Paired Accuracy (primary); Act accuracy; Abstain accuracy; CAR = Conditioned Abstention Rate (abstain
  accuracy restricted to pairs whose act side was solved)'
- 'Dual scoring signal: deterministic commit check on the tool-call trace + LLM judge on the terminal response (isolates
  post-hoc abstention)'
- Agent harness as a reported variable (Claude SDK, OpenAI SDK, Google ADK, OpenClaw)
