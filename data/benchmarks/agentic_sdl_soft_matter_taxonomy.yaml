transfer_relevant_findings:
- Explicitly proposes benchmark task templates and metric priorities for agentic SDLs -- closest thing found to
  a 2026 position paper on benchmarking lab agents.
- Constraint-violation behaviour and drift robustness are named as metrics, complementing AgentAbstain's abstention
  axis.
limitations:
