summary: |
  Survey/position paper framing SDL autonomy as an agent-environment interaction problem with explicit observations, actions, costs and constraints. Reviews BO/active learning, planning/RL and tool-using agents; emphasizes verifiable, provenance-aware policies; proposes a capability-driven taxonomy and synthesizes benchmark task templates and metrics prioritizing cost-aware performance, robustness to drift, constraint-violation behaviour and reproducibility; outlines open challenges (multi-modal representation, calibrated uncertainty, safe exploration, shared benchmark infrastructure).
schema_axes_proposed:
- Decision horizon (single-step/bandit to sequential MDP/POMDP)
- Uncertainty modeling
- Action parameterization
- Constraint handling (pre-execution enforcement vs post-hoc detection)
- Failure recovery
- Human involvement
- 'Metrics: cost-aware performance; robustness to drift/non-stationarity; constraint-violation behaviour; reproducibility
  (reconstructing conditions from provenance logs)'
- 'Environment properties: expensive actions; noisy and delayed feedback; strict feasibility/safety constraints;
  non-stationarity'
- Verifiable and provenance-aware policies
