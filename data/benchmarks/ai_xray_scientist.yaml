summary: |
  An LLM-driven agent (SLAC/Stanford) autonomously performs single-crystal sample alignment at a synchrotron beamline by planning actions, issuing instrument-control commands, interpreting experimental feedback and iterating. The procedure was developed and tested on an in-house virtual six-circle diffractometer mirroring an operational beamline (two detector motors, four sample motors) and then transferred to the real beamline without modification.
