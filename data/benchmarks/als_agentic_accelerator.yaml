summary: |
  First LLM-driven agentic system to autonomously execute multi-stage physics experiments on a production synchrotron light source (ALS accelerator). Natural-language prompts become structured plans combining archive data retrieval, control-channel resolution, script generation, controlled machine interaction and analysis, under plan-first orchestration, bounded tool access and operator-standard safety constraints. Not a beamline, but the same facility class and framework (Osprey) later used at ALS beamline 5.3.1.
