summary: |
  End-to-end framework integrating foundation models (ChatGPT for a Physical Control module that adjusts focus, exposure and stage movement in real time; Segment Anything for segmentation; clustering and topological analysis) to autonomously scan optical microscopes and characterise 2D materials zero-shot. Reports 99.7% segmentation accuracy for MoS2 monolayer identification, equal to human experts, and robustness to defocus, colour-temperature and exposure changes.
