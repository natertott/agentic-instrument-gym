summary: |
  Brief follow-up entry (training-data companion to ScienceAgentBench rather than a new benchmark). AutoSDT is an automatic Search-Select-Adapt pipeline that mines GitHub for ecologically valid data-driven discovery programs and synthesizes task instructions and solutions, yielding AutoSDT-5K (5,404 tasks in the same four SAB disciplines). Expert review of 256 tasks found 93% ecologically valid and 92.2% functionally correct. Fine-tuning Qwen2.5-Coder-32B-Instruct on it (AutoSDT-Coder-32B) reaches 7.8% SR on ScienceAgentBench, matching GPT-4o (2024-05-13) and doubling the base model, and lifts DiscoveryBench HMS to 8.1.
