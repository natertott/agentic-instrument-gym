summary: |
  AutoXRD is an autonomous LLM-agent framework for powder X-ray diffraction analysis (stepwise refinement grounded in observed evidence with deterministic crystallographic/physical checks). It introduces XRDBench with two tracks: XRDBench-QA (100 bounded diagnostic reasoning tasks) and XRDBench-E2E (34 executable workflows). Ten LLMs were evaluated across 1,340 runs. Data-analysis rather than instrument-control benchmark, but the closest X-ray agent benchmark with a full leaderboard.
