  headline_results:
  - Ten LLMs, 1,340 runs; mean 57.8/100; best overall GPT-5.6 Sol 81.1
  - Scores drop from 61.9 on XRDBench-QA to 53.7 on XRDBench-E2E
  - GPT-5.6 Terra highest E2E point estimate 81.0; GPT-5.6 Luna best score-cost trade-off
  - Strongest on refinement-history assessment and result acceptance; weakest on refinement-action selection, phase
    quantification, indexing, Rietveld refinement
