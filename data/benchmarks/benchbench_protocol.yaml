summary: |
  BenchBench-Protocol contains 149 protocol-modification tasks recovered from real edits scientists made to published protocols during experimental work (96 source protocols, nine wet-lab biology domains). Each task asks the model to adapt a protocol to a new experiment and is scored with an expert-verified weighted rubric grounded in the actual modification and its downstream dependencies. Claude Opus 5 leads at 59.2% normalized rubric score; others score 34.1-47.1%.
