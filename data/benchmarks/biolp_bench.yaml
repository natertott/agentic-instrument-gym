  headline_results:
  - Human baseline 79% accuracy
  - GPT-4o 17%, Mistral Large 16%; GPT-4o mini, Claude 3 Haiku, Claude 3.5 Sonnet, Mistral Nemo, Gemini 1.5 Flash/Pro
    ~7%
  - Manual review of GPT-4o grading found no false positives/negatives
