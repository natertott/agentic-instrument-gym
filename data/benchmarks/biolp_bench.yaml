transfer_relevant_findings:
- Fault-injection into otherwise valid procedures is a cheap, contamination-resistant way to probe causal understanding;
  2024 frontier models were near floor.
limitations:
- Small single-author benchmark; number of protocols/test cases and later-model results not verified (bioRxiv blocked).
- A search excerpt also mentions '38.4%' for human experts on a random subset — inconsistent with the 79% figure;
  both unverified.
