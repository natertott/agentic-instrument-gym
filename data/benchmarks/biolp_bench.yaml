  agents_evaluated:
  - GPT-4o
  - GPT-4o mini
  - Mistral Large
  - Mistral Nemo
  - Claude 3 Haiku
  - Claude 3.5 Sonnet
  - Gemini 1.5 Flash
  - Gemini 1.5 Pro
