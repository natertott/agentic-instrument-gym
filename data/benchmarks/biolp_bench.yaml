summary: |
  BioLP-bench tests whether a model can find the single protocol-breaking mistake deliberately inserted into a biology lab protocol (alongside many harmless perturbations). Implemented on the UK AISI Inspect framework with model-graded scoring, it found frontier 2024 models far below humans: GPT-4o 17%, Mistral Large 16%, most others ~7%, vs a 79% human baseline.
