transfer_relevant_findings:
- Pseudocode/admissible-function abstraction makes protocol planning automatically gradable — a pattern reusable
  for instrument-control plans.
- Retrieval of pseudocode enabled generation of a protocol that worked physically — early evidence that abstracted
  plans transfer to the bench.
