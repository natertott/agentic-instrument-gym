summary: |
  BioPlanner introduces BioProt, a dataset of biology protocols (sourced from protocols.io) paired with pseudocode representations, and an automatic evaluation in which an LLM must reconstruct a protocol's pseudocode from a high-level description and a list of admissible pseudofunctions. GPT-4 predicted the next protocol step with 70.6% accuracy vs 65% for GPT-3.5, and a generated protocol was executed successfully in a wet lab as external validation.
