id: bioprobench
record_type: benchmark
name: 'BioProBench: A Corpus and Benchmark for Biological Protocol Reasoning in Autonomous Science (earlier title:
  Comprehensive Dataset and Benchmark in Biological Protocol Understanding and Reasoning)'
short_name: BioProBench
year: 2025
venue: ICML 2026 (per official repo citation); arXiv 2025-05-11
authors_short: Yuyang Liu et al.
arxiv: '2505.07889'
doi: null
url: https://arxiv.org/abs/2505.07889
code_url: https://github.com/YuyangSunshine/bioprobench
data_url: https://huggingface.co/BioProBench
license: CC BY-NC 4.0
status: published
summary: |
  BioProBench is a large-scale multi-task benchmark for procedural reasoning over biological wet-lab protocols, built from BioProCorpus (22,413 human-written protocols from 5 repositories across 16 subdomains) into 523,784 instances across five tasks: Protocol QA, Step Ordering, Error Correction, Protocol Generation and Protocol Reasoning. Frontier LLMs score ~70-74% on QA but fall to ~50% exact-match on ordering and <15 BLEU on generation, with weak quantitative precision and safety awareness.
benchmark_features:
  agents_evaluated:
  - Gemini-2.5-pro-exp
  - DeepSeek-R1
  - DeepSeek-V3
  - domain-specific small biology LLMs
  - 'ICML update: gpt-5.4-2026-03-05, gemini-3-flash-preview-nothinking, claude-sonnet-4-5-20250929'
  - others (12 total per README; 10 per v1 abstract)
  evaluation_target:
  - protocol_planning
  - question_answering
  - safety
  execution_mode: static_text
  has_abstention_eval: false
  has_human_baseline: null
  has_safety_eval: true
  headline_results:
  - Top models ~74% PQA accuracy; Gemini-2.5-pro-exp 70.27% PQA accuracy and 65% F1 on ERR
  - 'ORD: best exact match 51.80%, Kendall''s tau 0.81 for top model'
  - 'GEN: BLEU < 15 for all models'
  - Open models DeepSeek-R1/V3 approach closed-source levels on some tasks; small domain-specific models underperform
  holdout_or_split_design: Train/dev/test splits released as a training resource plus benchmark; exact sizes not
    verified
  instruments: []
  leakage_or_contamination_risk: Source protocols are public web documents (protocols.io etc.), so protocol text
