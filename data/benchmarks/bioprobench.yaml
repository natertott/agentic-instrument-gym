notes: |
  Verified from GitHub README (YuyangSunshine/bioprobench and /bioprotocolbench): corpus/instance counts, 5 tasks, metrics, CC BY-NC 4.0, ICML 2026 citation, 12 models. Numeric results (70.27%, 65% F1, 51.80% EM, tau 0.81, BLEU<15, ~74%) come from search excerpts of the arXiv HTML / OpenReview PDF (both blocked for direct fetch). Title changed between v1 ('Comprehensive Dataset and Benchmark...') and later versions. A companion agent paper (BioProAgent) is listed in the repo. DOI for ICML proceedings not yet available.
