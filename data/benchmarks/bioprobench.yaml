transfer_relevant_findings:
- Surface comprehension (QA) is nearly solved while ordering/generation — the parts an executing agent actually
  needs — remain at ~50% EM / <15 BLEU.
- High Kendall's tau with low exact match implies models grasp local pairwise step order but not global procedure
  structure — analogous to LabOSBench's subtask-vs-workflow gap.
- Explicit finding of poor quantitative precision and safety awareness in protocol text.
limitations:
- Text-only; no execution or instrument feedback.
- Automatically constructed instances at 500k scale; per-task test sizes and human validation rate not verified
  here.
