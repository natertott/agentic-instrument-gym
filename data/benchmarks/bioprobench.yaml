  metric_types:
  - success_rate
  - partial_credit
  - calibration
  - other
  n_agent_configs: 12
  n_instances_or_runs_reported: null
  n_task_families: 5
  n_tasks: 523784
  open_source: true
  primary_metric: 'Task-specific: accuracy (PQA), exact match + Kendall''s tau (ORD), F1 (ERR), BLEU + step recall/precision
    (GEN), accuracy/Brier (REA)'
  repetitions_per_task: null
  sampling_strategy: Protocols collected from 5 authoritative protocol repositories; task instances systematically
    (largely automatically) constructed from them with quality filtering; benchmark test subsets drawn from the
    instance pool (split sizes not verified).
  scientific_domains:
