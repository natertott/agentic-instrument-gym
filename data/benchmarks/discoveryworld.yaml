  - '11 human scientists: 66% average task completion, 55% average knowledge score; 11 of 16 human-played tasks
    had completion rates above 60%'
  holdout_or_split_design: 'Recommended theme-level split (train: Proteomics, Combinatorial Chemistry; dev: Archaeology,
