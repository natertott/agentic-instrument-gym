summary: |
  DiscoveryWorld is a turn-based 2D simulated environment (text/JSON observations with an optional 16x24-tile image) in which an agent must run complete cycles of scientific discovery -- form hypotheses, use virtual instruments to collect measurements, analyse data, and act on conclusions. It contains 120 benchmark tasks (8 discovery themes x 3 difficulty levels x 5 parametric seeds) plus 10 'small skills' unit tests, scored by binary task completion, a normalized procedural-progress scorecard, and LLM-judged recovery of explanatory knowledge. GPT-4o-based ReAct, Plan+Execute and Hypothesizer agents complete far fewer tasks than 11 human scientists (e.g. ReAct 38% of easy and 18% of challenge tasks vs. a 66% average human completion rate).
benchmark_features:
