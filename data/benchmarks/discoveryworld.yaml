sample_environment_features:
  calibration_or_api_state_variation: null
  environment_description: Gym-like Python API (loadScenario / getAgentObservation / performAgentAction / tick).
    Observations are JSON dicts (nearby & accessible objects with UUIDs, inventory, location, dialog state, DiscoveryFeed
    posts, last action result, task description) plus optional base64 images with/without grid. Scorecards expose
    completion, normalized progress, sub-goal list and critical questions (hidden from the agent). A GUI (scripts/userstudy.py)
    supports human play; full world-state logs and videos are exported.
  injected_faults: false
  novelty_control: Fictional worlds; 5 vetted seeds per template; theme-level train/dev/test recommendation
  sample_real_or_simulated: simulated
  sample_types:
  - simulated soil, plants, rocks, artifacts, chemicals, animals/NPCs, reactor crystals, rocket components on a
    32x32 tile grid
  signal_quality_variation: Parametric seeds vary hidden ground-truth values (e.g. which species is the outlier,
    correct nutrient); no explicit sensor noise model documented
  novelty_levels_tested: []
