  vision_used: mixed
transfer_relevant_findings:
- Large human-agent gap on the same tasks (66% vs <=38% completion) despite tasks being 'difficult but solvable'
  for domain experts
- Procedural progress scores are much higher than completion, i.e. agents perform many correct steps but fail to
  close the discovery loop
- 'Knowledge discovery lags task completion: agents can sometimes finish a task by brute force without articulating
  the explanatory mechanism (humans also did this, lowering their knowledge score to 55%)'
- Iterative plan decomposition (Plan+Execute) and explicit hypothesis memory (Hypothesizer) change the failure profile
  but do not close the gap
- 'Repo errata: scorers for Lost in Translation and Rocket Science had bugs during the human study and were corrected
  post hoc; earlier knowledge scoring used a different scorecard key, so re-scoring released logs requires care'
limitations:
- Single backbone (GPT-4o) for all baseline agents; costs capped per run
- Only 5 seeds per template; some seeds >4 may generate unsolvable scenarios
- Knowledge scoring depends on GPT-4o as judge over agent notes/thought strings
- Simulated instruments return clean values; no noise, drift or calibration modelling
- Human study covered 16 of the tasks (Normal/Challenge, seed 1) with 11 participants
