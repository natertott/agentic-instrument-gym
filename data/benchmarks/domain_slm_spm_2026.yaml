summary: |
  Proposes an autonomous-laboratory agent built from customised small, domain-specific language models coordinated through a modular AI interface with AI-driven measurement tools, targeting deterministic execution under strict physical constraints. Demonstrates real-time atomic-resolution scanning probe microscopy experiments at room temperature with instruction-level control and multi-step experimental planning.
