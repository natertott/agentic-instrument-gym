summary: |
  A multimodal-LLM interface to a commercial Thermo Fisher FIB-SEM that translates high-level user operations into structured AutoScript API calls for site-specific cross-sectioning, surface/sub-surface feature detection and targeted milling, with LLM-driven vision processing. Presented as reducing manual intervention and user variability; no quantitative evaluation visible in the abstract.
