summary: |
  A provenance-tracked multi-agent platform (Maestro planner delegating to specialised controllers, with Guardian and Scribe agents attaching provenance and uncertainty summaries) that turns raw EM images into materials insight: segmentation, crystal-structure determination, property prediction, literature comparison and report generation. Evaluated on 20 material systems and five canonical tasks; it analyses images rather than controlling the microscope.
benchmark_features:
  agents_evaluated:
  - EMSeek multi-agent system (LLM via LiteLLM
  - configurable)
  - Segment Anything (baseline)
  - single-expert property models (baselines)
  evaluation_target:
  - data_analysis
  - perception
  - question_answering
  execution_mode: static_code_eval
  has_abstention_eval: false
  has_human_baseline: true
  has_safety_eval: false
  headline_results:
  - End-to-end analysis in 2–5 min per image, ~50x faster than expert workflows (phys.org / HyperAI summaries)
  - ~2x faster and higher accuracy than Segment Anything on segmentation (secondary)
  - Structural similarity >90% on STEM2Mat (secondary)
  - With ~2% labelled data for calibration, meets or exceeds strong single-expert models on three OOD property-prediction
    benchmarks (secondary)
  holdout_or_split_design: Out-of-distribution property-prediction benchmarks with calibration on ~2% labelled data
    (secondary source)
  instruments:
  - name: none (offline EM/STEM images)
    modality: microscopy
