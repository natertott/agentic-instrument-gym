summary: |
  EnvTrace evaluates LLM-generated instrument-control code by executing both the generated code and a ground-truth reference inside a sandboxed beamline "control-logic digital twin" (Bluesky/IPython driving EPICS IOCs in Docker) and aligning the resulting execution traces (time-stamped EPICS PV state changes) rather than comparing code text. Traces are scored on state (discrete sequence), temporal, continuous-profile and structural equivalence, yielding a continuous "full score" and a strict binary "EnvTrace accuracy". Over 30 LLMs were benchmarked on natural-language-to-beamline-code tasks from the VISION system at NSLS-II, with top closed models approaching beamline-scientist (human) performance.
