transfer_relevant_findings:
- Trace alignment on a digital twin gives a semantic correctness signal that text metrics (exact match, CodeBLEU,
  Levenshtein) miss; the VISION test harness computes all of them side by side
- The same digital twin doubles as a pre-execution validator for live experiments (dry-run before hardware)
- Binary 'accuracy' is deliberately strict (exact sequence + timing); the continuous 'full score' gives partial
  credit, useful for ranking weaker/open models
- Metric weights and comparators are configurable per channel, so the method ports to other stateful control systems
  (robotics, industrial automation)
limitations:
- Digital twin captures control logic (PV changes) only, not physics/detector data; scientific outcome quality is
  not scored
- Small task set (~136) from a single beamline API; ground truth may admit alternative valid implementations (mitigated
  by multiple expected_code entries and ignore_pvs)
- Per-model scores, run counts and the human-baseline protocol could not be verified from primary text in this session
