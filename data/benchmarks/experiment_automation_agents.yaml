summary: |
  EAA is a vision-language-model agent runtime for scientific instruments, built on LangGraph task managers with tool calling, an image-follow-up mechanism so the model can see images returned by tools, optional Chroma-based long-term memory, and two-way MCP compatibility (consume instrument MCP servers; serve EAA tools to Claude Code / Gemini CLI). It was demonstrated at an Advanced Photon Source imaging beamline for automated zone-plate focusing, natural-language feature/ROI search and interactive data acquisition, spanning fully agent-driven to logic-defined workflows with embedded LLM queries.
