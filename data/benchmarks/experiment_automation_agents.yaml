transfer_relevant_findings:
- Image-follow-up (tools return img_path; model sees the PNG) is the key primitive for vision-in-the-loop instrument
  agents
- Two-way MCP lets the same instrument tools be driven by EAA, Claude Code or Gemini CLI, decoupling agent harness
  from instrument
- 'Hybrid design: deterministic logic-defined workflows with localized LLM queries where full autonomy is unnecessary'
