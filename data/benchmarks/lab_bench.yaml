  open_source: true
  primary_metric: Accuracy (with precision and coverage reported separately because models may decline to answer)
  repetitions_per_task: null
  sampling_strategy: Questions written/curated by domain experts across eight categories; ~80% (1,967 questions)
    publicly released, ~20% held privately for contamination monitoring. CloningScenarios are complex real-world
