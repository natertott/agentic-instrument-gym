summary: |
  LAB-Bench is a 2,400+ question multiple-choice benchmark of practical biology-research capabilities: literature extraction (LitQA2), database retrieval (DbQA), supplementary-information access (SuppQA), figure and table interpretation (FigQA, TableQA), protocol troubleshooting (ProtocolQA), sequence manipulation (SeqQA) and multi-step molecular cloning scenarios (CloningScenarios). Models are scored on accuracy, precision and coverage (they may abstain) against human expert biologists.
benchmark_features:
  agents_evaluated:
  - Claude 3.5 Sonnet
  - GPT-4o
  - other frontier and open models (full list not verified)
  evaluation_target:
  - question_answering
  - protocol_planning
  - data_analysis
  execution_mode: static_text
  has_abstention_eval: true
  has_human_baseline: true
  has_safety_eval: false
  headline_results:
  - Claude 3.5 Sonnet leads by a narrow 0.033 accuracy margin over GPT-4o (search excerpt)
  - All models near random on FigQA except Claude 3.5 Sonnet
  - On open-response CloningScenarios both Claude 3.5 Sonnet and GPT-4o score only 0.20 accuracy, suggesting reliance
    on distractor elimination
  - Models often refuse to answer questions requiring database or supplementary-material lookup, lowering coverage
  holdout_or_split_design: 80% public / 20% private held-out subset for contamination monitoring
  instruments: []
  leakage_or_contamination_risk: Public 80% split is widely used and likely in pre-training corpora by now; private
    20% mitigates. LABBench2 (2026) was created partly because LAB-Bench abilities 'improved substantially'.
