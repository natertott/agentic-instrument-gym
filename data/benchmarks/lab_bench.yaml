transfer_relevant_findings:
- Abstention-aware scoring (precision vs coverage) separates knowledge gaps from refusal behaviour — a design worth
  borrowing for instrument agents.
- ProtocolQA and CloningScenarios are the lab-workflow-relevant subsets; multi-step cloning is where frontier models
  fell to 0.20 in open-response mode.
- Successor LABBench2 shows 26-46% accuracy drops when the same capabilities are tested in more realistic contexts
  (PDFs, images, bioinformatics files) — realism of the interface, not the concept, drives difficulty.
limitations:
- MCQ format allows distractor elimination; no execution or instrument interaction.
- Per-category counts, full model list and exact numeric table could not be verified (arXiv/HF blocked).
