summary: |
  LABBench2 reprises the LAB-Bench capability categories with ~1,900 tasks in more realistic contexts (answering from PDFs, images and bioinformatics files), adds open-response/retrieval variants for figures and tables, and new families for patents, clinical trials and source-quality assessment. Model accuracies drop 26-46% per subtask relative to LAB-Bench.
