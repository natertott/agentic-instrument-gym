summary: |
  LabOS is a system paper, not primarily a benchmark: an AI co-scientist combining a self-evolving multi-agent reasoning stack (planning/manager, researcher/development, critic, tool-creation agents drawing on a 'Tool Ocean' of autonomously generated tools) with XR smart-glasses interfaces for human-in-the-loop physical lab execution. It introduces LabSuperVision, a VLM benchmark of 200+ egocentric lab video sessions with protocols, step segments and expert-labeled error events, and reports results on HLE-Biomedicine, LAB-Bench subsets and wet-lab error detection.
