transfer_relevant_findings:
- Claims a lab-specific VLM benchmark (LabSuperVision) yields visual reasoning that surpasses general-purpose models
  on lab-specific tasks — i.e., domain video data matters for perception of lab state.
- System-level rather than benchmark-level evidence; useful mainly as a source of the LabSuperVision perception
  benchmark and as context for the (unrelated) LabOSBench name.
limitations:
- Primarily a system/demonstration paper; evaluation numbers are reported by the authors on their own README without
  full tables verified here.
- LabSuperVision task definitions, metrics and release status could not be verified (HF/bioRxiv blocked).
