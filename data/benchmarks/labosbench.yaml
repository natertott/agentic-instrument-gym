notes: |
  arXiv abstract/HTML pages were egress-blocked; title, author list (Anqi Zou, Han Deng, Chengyu Zhang, Junquan Hu, Yu Wang, Yuxiang Xing, Aokai Zhang, Hanling Zhang, Zhaoyang Liu, Ben Fei, Zhihui Wang, Wanli Ouyang), abstract claims, the 3-paradigm taxonomy, baseline list, headline numbers (0.924 human, 0.814 GTA1, 0.763 Seed-1.6, 0.726 GPT-5.5, 26.3% end-to-end, per-instrument 70/80/60%) and the limitations paragraph come from search-engine excerpts of arxiv.org/html/2606.16802 and should be re-checked against the PDF. The arXiv abstract title uses 'for'; the HTML version title reads 'towards'. Per-instrument subtask counts, Playwright/OSWorld architecture, run parameters and license statement were verified directly from the GitHub README (Su-ISE-2001/LABOSBENCH, created 2026-06-15). The 0.35/0.325/0.275 small-model scores come from a third-party mirror (benchmarklist.com) quoted in a search excerpt. Author affiliations, submission date, exact step budget, and the exact subtask-checker definitions could not be verified. There is no evidence LabOSBench is affiliated with the LabOS AI-XR co-scientist project; the shared name appears coincidental (different author groups; LabOS README does not mention LabOSBench).

  [extract_E.yaml] Recorded briefly because it includes microscope simulators (SEM/TEM/LFM/SPM); abstract and design details come from a GitHub mirror (CMander02/DailyAgentPapers). Probably covered by another extractor - merge on arxiv id.

