status: preprint
summary: |
  LabOSBench is a browser-based, executable benchmark for multimodal GUI / computer-use agents that must operate eight web simulators of scientific instruments (SEM, TEM, LFM, XRD, EDS, APT, FIB, SPM) through realistic control panels (sliders, toggles, live plots, status indicators). It defines 96 subtasks spanning sample loading, alignment, parameter tuning, data acquisition and result inspection, plus full-workflow (end-to-end) episodes, and scores agents with execution-based state checks. Strong general multimodal models complete many structured subtasks but collapse on feedback-driven adjustment, scientific-state interpretation and long-horizon execution.
schema_axes_proposed:
- Instrument type (FIB, SEM, EDS, APT, light/fluorescence microscope, SPM, TEM, XRD)
- 'Workflow stage: sample loading; alignment; parameter tuning; data acquisition; result inspection'
- 'Evaluation level: subtask vs end-to-end workflow'
- 'Agent class: general-purpose VLM vs specialized GUI-agent model vs agentic framework'
- 'Operation type: structured GUI actions vs feedback-driven parameter adjustment'
- Execution-based (state-checked) evaluation in browser simulators rather than OS virtualization
