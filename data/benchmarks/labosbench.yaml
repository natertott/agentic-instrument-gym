transfer_relevant_findings:
- 'Subtask competence does not transfer to workflow competence: GPT-5.5 scores 0.726 on average subtasks but 26.3%
  end-to-end, with 0% on five of eight instruments.'
- 'Task difficulty tracks feedback structure, not instrument prestige: EDS/XRD/APT (structured operations, clear
  feedback, short sequences) are solvable; SEM/FIB/LFM (feedback-driven focusing, image-quality adjustment, long
  procedures, fine-grained visual localization) are not.'
- General-purpose frontier VLMs outperform GUI-specialized 7-8B models by a wide margin (0.73-0.76 vs 0.28-0.35),
  and wrapping a frontier model in an agentic GUI framework (GTA1) adds further gains (0.814).
- A human baseline of 0.924 shows the tasks are well-posed for operators, so the gap is agent capability, not task
  ambiguity.
- Subtask vs full-task modes separate local GUI grounding failures from long-horizon compounding failures - a split
  design relevant to modelling transfer.
- Closest existing benchmark to 'LLM agents controlling scientific instruments'; its instrument x workflow-stage
  grid is a natural schema template.
- Separates structured GUI competence from feedback-driven control -- the latter is where agents fail.
limitations:
- 'Web simulators, not physical instruments: cannot capture hardware latency, calibration uncertainty, safety constraints,
  or real laboratory failure modes (authors'' statement).'
- Covers a selected set of instruments (microscopy, spectroscopy, diffraction, tomography); excludes wet-lab protocols,
  robotic manipulation, chemical synthesis, multi-instrument experimental planning (authors' statement).
- Evaluation relies on screenshots and logged simulator states; some scientific decisions may require richer observations,
  domain knowledge or multimodal sensor signals (authors' statement).
- Repo is early-stage (3 commits; unified CLI, Docker, VLAA-GUI/Hippo baselines and cross-subtask memory evaluation
  listed as 'coming soon').
- Simulated GUIs only; per-model numbers not accessible in this session.
- GUI-only interface (no API/scripting control); simulators, not real instruments; model list and run counts unverified.
