summary: |
  Knowledge/reasoning benchmark for lab-safety competence of LLMs and VLMs built on a taxonomy aligned with OSHA protocols. Latest version: 765 expert-verified multiple-choice questions (632 text-only, 133 multimodal) plus 404 realistic lab scenarios yielding 3,128 open-ended questions in two tasks -- Hazards Identification Test (HIT) and Consequence Identification Test (CIT). Across 19 LLMs/VLMs no model exceeds 70% on hazard identification; proprietary models lead on MCQs but not on open-ended scenario reasoning.
schema_axes_proposed:
- Hazard taxonomy aligned with OSHA protocols (categories x subcategories; exact counts unverified -- one third-party
  note says 4 x 10)
- 'Question format: multiple-choice (text-only vs multimodal/image) vs open-ended scenario'
- 'Scenario tasks: Hazards Identification Test (HIT) and Consequence Identification Test (CIT)'
- Reporting by category, difficulty level and subject area
- 'Prompting conditions: zero-shot, chain-of-thought, few-shot, hints'
