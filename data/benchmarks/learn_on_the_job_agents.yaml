summary: |
  Human-in-the-loop LLM-agent pipeline (Argonne) for operating an X-ray nanoprobe beamline and an autonomous robotic materials station. Multiple LLMs are evaluated as trainable assistants orchestrating multi-task, multimodal workflows: from function execution via logical/algebraic inference to acquire a 2D scan, to image analysis that picks coordinates to zoom and rescan, coordinating a vision agent that locates suitable nanoparticle candidates. Performance is reported as percentages with standard deviations over four trials per condition, with and without human feedback.
