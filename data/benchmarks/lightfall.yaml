summary: |
  Lightfall is a facility-wide beamline control platform (PySide6 GUI, Bluesky/ophyd, Tiled, EPICS, NATS IPC) whose API-first architecture exposes every panel, device and scan plan through one uniform addressable interface. An embedded Claude-based agent drives experiments from single move-and-read to Gaussian-process-driven autonomous scans, and beamline staff extend the application at runtime via "skills" plugins the agent authors and commits. In testing at the ALS COSMIC-Scattering beamline; endstation plugins exist for ALS 7.0.1.1 and NSLS-II CMS 11-BM. Demo/platform paper.
