summary: |
  An open hypothesis-learning framework for autonomous SPM in which symbolic regression proposes candidate analytical relationships from sparse measurements and an LLM-based evaluator ranks them by physical plausibility, closing the loop with new measurements. Demonstrated on autonomous piezoresponse force microscopy of ferroelectric domain switching in a PZT thin film starting from five seed measurements. The LLM reasons about SPM data/hypotheses rather than directly operating the instrument.
