summary: |
  Builds an automated SPM measurement system in which an LLM interprets user commands received through a social-networking front end (a Slack app accepting text or audio in multiple languages) and a back-end embedded system executes the corresponding SPM operations, enabling real-time, language-agnostic remote control. Presented as a system demonstration toward self-driving labs rather than a quantitative benchmark.
