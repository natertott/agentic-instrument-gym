summary: |
  Explores using ChatGPT-4 together with scanning probe microscope APIs for experimental design, workflow programming and data analysis. The LLM converts natural-language experiment ideas into executable code on the microscope API and can describe microscopy images generically, but the authors report it fails to go beyond basic analyses for in-depth technical experimental design. Demonstration/perspective study rather than a benchmark.
