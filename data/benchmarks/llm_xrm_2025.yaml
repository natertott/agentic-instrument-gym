notes: |-
  Only the title, author, venue/volume and a one-sentence description ('describes the architecture of an LLM agent system used for controlling the Versa X-ray Microscope and performing image analysis') were visible in search snippets. Co-authors, DOI and any numbers are unverified. Other prior work by N. S. Johnson found: (i) M&M 2026 talk by co-author Ian Abshire, 'Closing the Loop in Microscopy Automation: Multi-Agent LLMs for Real-Time Image Acquisition, Image Processing and Experimental Steering Across Scientific Domains' (mm2026.eventscribe.net, room S201 D; no abstract accessible); (ii) the author's own statement (research proposal in the working scratchpad) that he began building autonomous X-ray characterization at SSRL in 2023 - no SSRL-era LLM-agent publication by Johnson could be located; the SSRL LLM beamline-alignment work found in search ('An agentic artificially intelligent X-ray scientist', Nature Machine Intelligence, July 2026, BL17-2) does not list Johnson in the snippets seen; (iii) non-agent papers: Johnson et al., Materials 17(16):4038 (2024) active learning for compositionally complex alloys; Johnson, Kafka, Moser, Materials Characterization 238:116524 (2026) sparse-projection in situ X-ray tomography with deep learning.

  [extract_F.yaml] demonstration. Authorship inferred from the NIST AIMS 2025 workshop programme listing 'Nathan Johnson (ZEISS): An Autonomous, Large Language Model Driven X-ray Microscope'; the OUP page itself was blocked, so authors and DOI need confirmation.
