  Conference proceedings abstract describing the architecture of an LLM-agent system that controls a ZEISS Versa X-ray microscope and performs image analysis with contextual (RAG-style) understanding of domain-specific experimental workflows. This is the precursor system to the 2026 benchmark paper; no benchmark-style quantitative evaluation could be verified from accessible sources.
