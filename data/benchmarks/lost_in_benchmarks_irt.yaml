summary: |
  Psychometric audit of LLM benchmarks motivated by leaderboard inconsistencies and poor separability among top models. Proposes PSN-IRT (Pseudo-Siamese Network for Item Response Theory), a 4-parameter IRT model trained end-to-end that jointly estimates model ability and per-item discrimination, difficulty, guessing rate and feasibility. Applied to 11 benchmarks (41,871 items, 12 LLMs via OpenCompass) it reveals varied measurement-quality shortcomings and shows that PSN-IRT-selected smaller item subsets align better with human preference.
schema_axes_proposed:
- 'Item discrimination (a): how well an item separates strong from weak models'
- 'Item difficulty (b): ability threshold for a correct answer'
- 'Guessing rate (c): probability of correct answer without competence (flags contamination/leakage)'
- 'Feasibility upper bound (d): max attainable success even for the best models'
- Model ability estimate (theta) as the latent quantity benchmarks should recover
- 'Benchmark-level diagnostics: saturation / low discrimination, insufficient difficulty ceiling, leakage, cross-leaderboard
  ranking inconsistency, redundancy (item subsets can reproduce full rankings)'
- Human-preference alignment as external validity check for a benchmark
