transfer_relevant_findings:
- A benchmark schema should carry per-item difficulty and discrimination (or at least report their distribution)
  so that a 53-task instrument suite can be judged for saturation and redundancy.
- High guessing rate is a contamination signal usable for physical-task benchmarks whose prompts leak online.
- Fewer, well-discriminating items can preserve ranking -- relevant when physical experiments are expensive.
limitations:
- Requires a response matrix over many models; with few evaluated agents item parameters are unstable (see jiang_2026_trust_irt).
