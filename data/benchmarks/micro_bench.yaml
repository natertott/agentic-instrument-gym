status: published
summary: |
  Expert-curated benchmark of 22 biomedical microscopy tasks: a Perception set of 17,235 images (17 fine-grained tasks: 13 classification, 4 segmentation/detection) and a Cognition set of 121 expert questions on 54 images, spanning light, fluorescence and electron microscopy (8 sub-modalities), subcellular to tissue scales, 24 public datasets. Generalist and specialist VLMs struggle even at modality identification; specialist fine-tuning causes catastrophic forgetting.
benchmark_features:
  agents_evaluated:
  - CLIP
  - OpenCLIP
  - ALIGN
  - CogVLM
  - Qwen-VL
  - BiomedCLIP
  - PLIP
  - QuiltNet
  - 'CONCH (11 VLMs total: 3 generalist autoregressive'
  - 3 generalist contrastive
  - 4 specialist contrastive
  - 1 biomedical contrastive)
  evaluation_target:
  - perception
  - question_answering
  execution_mode: static_text
  has_abstention_eval: false
  has_human_baseline: null
  has_safety_eval: false
  headline_results:
  - Models struggle on all categories; ~30% error even at distinguishing microscopy modality
  - Specialist biomedical models often underperform generalists
  - Weight interpolation (alpha 0.8) between fine-tuned and pre-trained weights mitigates forgetting
  holdout_or_split_design: Test split 17,315 examples on HuggingFace
