name: 'µ-Bench (Micro-Bench): A Vision-Language Benchmark for Microscopy Understanding'
short_name: µ-Bench
year: 2024
venue: NeurIPS 2024 Datasets and Benchmarks Track
authors_short: Lozano et al. (Stanford; Yeung-Levy lab)
