summary: |
  A VLM (fine-tuned 11B LLaMA) that predicts full atomic configurations (lattice parameters, elements, coordinates) from simulated STEM images of ~5,000 2D materials generated with AtomVision from JARVIS-DFT and C2DB. It is a perception model, not an agent benchmark, but defines an image-to-structure task relevant to EM perception.
