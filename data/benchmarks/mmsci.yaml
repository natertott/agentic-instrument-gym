name: 'MMSci: A Dataset for Graduate-Level Multi-Discipline Multimodal Scientific Understanding'
short_name: MMSci
year: 2024
venue: arXiv (Jul 2024; revised Oct 2024); OpenReview submissions (ICLR 2025 track) — final venue not confirmed
authors_short: Li et al. (UC Santa Barbara / POSTECH)
arxiv: '2407.04903'
doi: null
url: https://arxiv.org/abs/2407.04903
code_url: https://github.com/Leezekun/MMSci
