license: Apache-2.0 (code); CC BY 4.0 (data)
status: preprint
summary: |
  131,393 open-access Nature Communications articles with 742,273 figures (514,054 sub-figures) across 72 disciplines in 5 major categories, including microscopy images, schematics and experimental data. Benchmarks: scientific figure captioning (ungrounded / abstract-grounded / full-content-grounded) and three multiple-choice VQA settings (~1,200 samples each: figure captions, sub-captions, all sub-captions). Many open-source models are at chance; GPT-4o/GPT-4V also struggle.
benchmark_features:
  agents_evaluated:
  - GPT-4V
  - GPT-4o
  - Kosmos-2
  - BLIP-2
  - Qwen-VL-Chat
  - LLaVA variants
  - LLaVA-Next-MMSci
  - Qwen2-VL-2B/7B fine-tunes (19 models per digest)
  evaluation_target:
  - question_answering
  - perception
  execution_mode: static_text
  has_abstention_eval: false
  has_human_baseline: true
  has_safety_eval: false
  headline_results:
  - Many open-source models at chance on MCQ; GPT-4o highest METEOR/ROUGE in full-article-grounded captioning
  - Human expert MCQ baseline 86.2% (digest); fine-tuned Qwen2-VL-7B reported to exceed GPT-4o and human experts
    on MCQ
  - Fine-tuned Qwen2-VL-2B reaches GPT-4o-level MCQ accuracy; captioning remains hard
  holdout_or_split_design: test/dev splits released; training (visual-instruction >1M conversations; 108,843 multi-turn)
    and interleaved pretraining data separate
