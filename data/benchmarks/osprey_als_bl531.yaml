summary: |
  Deploys the Osprey agentic framework (LBNL; capability-based orchestration with plan-first execution, bounded tool access and mandatory human approval for hardware writes) at ALS beamline 5.3.1. Users state experiments in natural language; the agent translates them into structured workflows over predefined beamline capabilities executed through the Bluesky Queue Server, preserving deterministic execution and existing control-system constraints. Demonstration / deployment paper.
