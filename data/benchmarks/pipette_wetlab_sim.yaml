summary: |
  Pipette is a wet-lab robot-learning simulation platform releasing 43+ editable lab assets, an 11-task embodied benchmark (sample handling, culture-ware manipulation, device operation, precision placement), natural-language scene/task construction, and a demonstration-augmentation pipeline. It targets VLA/imitation policies (ACT, SmolVLA, pi0) rather than LLM agents, but is the closest lab-instrument simulator benchmark for physical manipulation.
