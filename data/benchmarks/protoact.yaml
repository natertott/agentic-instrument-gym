summary: |
  ProtoAct is a protocol-grounding framework (ProtoRAG retrieval, RefineChecker consistency checking, ActSchema schema-constrained JSON action functions) that converts free-form biology protocols into executable robot subtasks. It introduces BioP2E, in which 22 cell-culture protocols were manually annotated into 258 monitoring conditions, 910 executable subtasks and 962 grounded action calls, and evaluates seven LLM backbones.
