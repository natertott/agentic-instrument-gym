summary: |
  Brief follow-up entry. ResearchCodeBench contains 212 coding challenges drawn from 20 recent (2024-2025) ML papers: the model sees the paper, surrounding project code and a TODO-marked snippet to fill in, and is graded by executing tests. Across 30+ proprietary and open models the best (Gemini-2.5-Pro-Preview) solves 37.3%, followed by o3-high (32.3%) and o4-mini-high (30.8%).
