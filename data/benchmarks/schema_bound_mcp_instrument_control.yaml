notes: |
  Only a search snippet was accessible; authors, evaluation details and code URL unverified -- 'demonstration, not benchmark' pending full-text check. Adjacent 2026 preprints surfaced but NOT verified as SPM-specific and therefore not given records: 'LAP: An Agent-to-Instrument Protocol for Autonomous Science' (arXiv 2606.03755), "It's not the Language Model, it's the Tool: Deterministic Mediation for Scientific Workflows" (arXiv 2605.13245), and Xie, He & Castellanos-Gomez, 'Toward Full Autonomous Laboratory Instrumentation Control with LLMs', Small Structures 6:2500173 (2025) (scanning photocurrent microscope / single-pixel camera, ChatGPT-assisted scripting, no benchmark). Also surfaced: 'Integrated AI Framework for Room-Temperature Atom Manipulation in SPM' (Nano Letters 2025; 25 h autonomous STM atom manipulation) and 'Autonomous STM Imaging via Deep Learning' (JACS 2024) -- these use CNN/U-Net/DQN agents, with no verified LLM component, so they are excluded. No dedicated STM-LLM-agent benchmark with quantitative evaluation was found in this session's searches.
