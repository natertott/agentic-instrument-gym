summary: |
  Positions the Model Context Protocol (MCP) as the binding layer between LLM agents and scientific instruments, exposing instrument capabilities as schema-checked MCP tools/skills so that agent actions are bounded and traceable. Scanning probe microscopy (specifically AFM) is chosen as the experimental testbed; the text describes schema-checked agent traces and reproducible regression suites as the intended foundation for closed-loop autonomous microscopy.
