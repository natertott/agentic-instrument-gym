transfer_relevant_findings:
- Schema-bound tool interfaces are proposed precisely to remove the free-form code-generation failure class that
  dominates AFMBench errors; the AILA repo itself contains a FastMCP server variant that scored 36.7% on a 10-task
  subset with Claude 3.5 Sonnet.
