summary: |
  Brief follow-up entry (not a ScienceAgentBench version, despite the similar name). SciAgentGym is an interactive environment with 1,780 domain-specific tools across four natural-science disciplines, and SciAgentBench is a tiered evaluation suite of 259 tasks (1,134 sub-questions) in physics (109), chemistry (81), materials science (37) and life sciences (32), graded L1-L3 by step count. GPT-5's success falls from 60.6% to 30.9% as horizons lengthen; the authors' SciForge data synthesis trains an 8B model (SciAgent-8B) that outperforms a 235B model.
