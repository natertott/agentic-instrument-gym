notes: |
  Verified from GitHub (README, LICENSE, docs/20250110_docker, project-site source in gh-pages): task count, source count, expert count, disciplines, metrics names, frameworks, three-run best-of selection, licensing, docker harness, update timeline (2024-10-24 o1 results added; 2024-10-31 OpenHands integration; 2025-01-10 docker; 2026-04-30 verified release). Headline percentages (32.4/34.3/42.2/16.7), contamination strategies, rubric stages and per-framework comparisons come from search snippets quoting the arXiv abstract/HTML and could not be re-read on arxiv.org. Not verifiable here: exact per-discipline task counts, the fifth base LLM name, n_agent_configs, human-rubric agreement statistics, and the HF split structure of the verified release. DOI: none (ICLR/OpenReview id 6z4YKr0GK6).
