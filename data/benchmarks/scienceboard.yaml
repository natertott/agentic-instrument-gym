  - Claude-3.7-Sonnet
  - Gemini (2.x)
  - Qwen2.5-VL
  - InternVL (incl. InternVL-3)
  - QVQ
  - OS-Atlas
  - GUI-Actor
  - UI-TARS-72B-DPO and UI-TARS-1.5-7B
  - GPT-5 (added in v3)
  - CODA (authors' dual-brain planner+executor agent, Aug 2025, reported SOTA)
