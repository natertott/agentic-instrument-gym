transfer_relevant_findings:
- Observation modality strongly affects success; SoM prompting that helps on general GUI benchmarks can hurt on
  dense scientific UIs
- 'GUI-specialist action models (UI-TARS, OS-Atlas) do not close the gap: domain/software knowledge and planning
  dominate'
- Large human-agent gap (60.27% vs ~15-24%) persists across model generations
- Dual-brain planner/executor (CODA) improves over single agents, suggesting decomposition of scientific reasoning
  and grounding
limitations:
- Binary success only; no partial credit or cost reporting verified
- Requires proprietary VMware and a large VM image; evaluation is slow and hardware-heavy
- Six applications; tasks per app are small (16-34)
- Human performance details (number of participants, protocol) not verifiable here
