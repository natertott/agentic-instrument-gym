summary: |
  ScienceBoard is a computer-use benchmark in which multimodal agents operate real scientific desktop software inside an Ubuntu virtual machine (built on the OSWorld infrastructure) to complete 169 human-curated tasks in six applications: UCSF ChimeraX (biochemistry), KAlgebra (algebra), Lean 4 (theorem proving), GRASS GIS (geoinformatics), Celestia (astronomy) and TeXstudio (scientific writing). Agents observe screenshots and/or accessibility trees and act through GUI (pyautogui) and CLI actions; success is verified by querying the applications' internal state through instrumented plugins/REST servers. State-of-the-art agents (GPT-4o, Claude 3.7, UI-TARS, etc.) reached only about 15% overall success at release, versus 60.27% for humans; later GPT-5 reached 24.20% under the best observation setting.
benchmark_features:
