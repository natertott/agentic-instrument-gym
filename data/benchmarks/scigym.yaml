  - protocol_planning
  - data_analysis
  - code_generation
  execution_mode: simulator
  has_abstention_eval: false
  has_human_baseline: false
  has_safety_eval: false
  headline_results:
  - 'Gemini-2.5-Pro best: STE 0.3212, RMS-with-modifiers F1 0.1817, RMS-without-modifiers F1 0.3383 (project page
    Table 1)'
  - 'Claude-3.7-Sonnet: STE 0.3615, F1 0.1688 / 0.3047; GPT-4.1: STE 0.4611, F1 0.1740 / 0.3038'
  - 'Mini variants worse: Gemini-2.5-Flash STE 0.4181 (F1 0.1217/0.2005), GPT-4.1-mini STE 0.6007 (0.1320/0.2322),
    Claude-3.5-Haiku STE 0.6281 (0.0530/0.0987)'
  - Simulation error rises from ~0.1 to ~0.55 for top models as reactions grow from 2 to 10
  - Best model's F1 is ~5x higher for reactant-product links than for modifier links
  holdout_or_split_design: small (137, evaluated) vs large (213, unevaluated) splits; within a task, evaluation
