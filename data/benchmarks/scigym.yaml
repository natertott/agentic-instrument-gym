transfer_relevant_findings:
- Proposed mechanisms overfit to the specific experiments run and fail to generalize to unseen initial conditions
  -- direct evidence that agents fit data rather than mechanisms
- Steep degradation with system size (2 -> 10 reactions) even for frontier models; large split (up to 400 reactions)
  left unevaluated
- Subtle (modifier) relationships are systematically missed relative to mass-action reactant/product links
- '''Pro'' models beat ''mini'' models consistently across families, suggesting capability rather than family drives
  performance'
limitations:
- Perturbation space is narrow (initial-concentration changes only in the released prompt)
- No human baseline; no cost/time reporting verified
- Only 137 of 350 systems evaluated; no repository license file
