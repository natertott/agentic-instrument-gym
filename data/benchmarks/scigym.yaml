summary: |
  SciGym is an agentic 'dry lab' benchmark: curated SBML models of biological systems from BioModels serve as hidden ground-truth simulators, the agent receives a partial model with reactions removed, and it must iteratively request perturbation experiments (observe; change initial concentrations), analyse the returned time series in Python, and finally submit a complete SBML model. Submissions are scored by reaction-recovery precision/recall/F1 (with and without modifiers) and by simulation trajectory error (SMAPE) under both observed and unseen perturbations. Six frontier LLMs were evaluated on the 137-system 'small' split (<10 reactions); Gemini-2.5-Pro was best, and all models degrade sharply as system complexity grows.
benchmark_features:
  agents_evaluated:
  - 'ReAct-style Thoughts-Actions-Observations agent with: Gemini-2.5-Pro-Preview-03-25, Gemini-2.5-Flash-Preview-04-17,
    Claude-3.7-Sonnet-20250219, Claude-3.5-Haiku-20241022, GPT-4.1-2025-04-14, GPT-4.1-mini-2025-04-14'
  evaluation_target:
