summary: |
  Brief follow-up entry. SciReplicate-Bench asks agents to implement algorithms described in recent NLP papers inside the papers' real code repositories: 100 tasks from 36 papers published in 2024, each with a prepared conda environment and test cases. The authors' Sci-Reproducer dual-agent framework (Paper Agent + Code Agent with repository and web-search tools) achieves at most 39% execution accuracy; missing or inconsistent algorithm descriptions are the main barrier.
