summary: |
  Safety-alignment benchmark for scientific LLMs spanning chemistry, biology, medicine and physics with 31,840 samples expressed in textual, molecular (SMILES), protein (FASTA) and genomic representations. Evaluates zero-shot, few-shot and chain-of-thought settings and adds a 'jailbreak' feature (WildTeaming adversarial prompts) to test defenses against malicious intent; scoring is pass/fail on whether the model refuses hazardous requests.
schema_axes_proposed:
- 'Scientific domain: chemistry / biology / medicine / physics'
- 'Input representation: natural language; molecular (SMILES); protein (FASTA); genomic sequence'
- 'Prompting regime: zero-shot; few-shot (5-shot); chain-of-thought'
- 'Adversarial regime: jailbreak-enhanced prompts (WildTeaming)'
- 'Metrics: refusal/pass rate (harmlessness), helpfulness, jailbreak success rate'
