transfer_relevant_findings:
- Refusal-only scoring assumes refusal is always correct -- the opposite failure mode (over-refusal) is not measured,
  which AgentAbstain's paired design addresses.
- Representation axis (SMILES/FASTA/genomic vs text) is a useful template for instrument benchmarks that mix natural-language
  and machine-readable inputs.
limitations:
- Single jailbreak method; no benign-vs-harmful pairing; no execution.
- Author list, license, venue and per-domain task counts could not be verified.
