summary: |
  Perspective arguing that SDL studies cannot be compared from publications alone because reported quantities (e.g. optimization rate) are not comparable across experimental spaces. Proposes a shared definition of an SDL ("automated experimental workflows (physical world) with algorithm-selected experimental parameters (digital world)") and seven performance metrics that every SDL paper should report, then reviews the literature under that lens (only 23% of surveyed studies included real-world benchmarking; 62% of ML studies showed model validation; 71% reported no precision data).
schema_axes_proposed:
- 'Degree of autonomy (levels: piecewise; semi-closed-loop; closed-loop; self-motivated)'
- Operational lifetime (demonstrated unassisted; demonstrated assisted; theoretical unassisted; theoretical assisted;
  plus labor requirements/scalability)
- Throughput (theoretical throughput vs demonstrated throughput; covers material preparation rate and analysis speed)
- Experimental precision (standard deviation of replicates of a single condition, collected in an unbiased/interleaved
  manner)
- 'Material usage (safety, monetary cost, environmental impact: total active hazardous quantity; total material
  per experiment; high-value material per experiment; environmentally hazardous material per experiment incl. waste
  streams)'
- Accessible parameter space (demonstrated vs theoretical ranges; min/max bounds per parameter; parameterization
  in the optimizer; qualitative constraints on usable parameters)
- Optimization efficiency (optimized feature achieved and number of experiments required; benchmark vs state-of-the-art
  literature and vs random sampling; regression validation with train/test split; explainable-AI parameter influence,
  e.g. Shapley plots)
