transfer_relevant_findings:
- Generalizability is framed as cross-laboratory transfer of workflows AND learned models -- an agent benchmark
  should test transfer across instruments/labs, not just across tasks on one rig.
- Provenance completeness (structured metadata sufficient to reconstruct an experiment) is elevated to a first-class
  requirement, implying benchmarks should score trace/log completeness.
- Trustworthy reasoning under uncertainty within safety/ethical bounds is named as a requirement for AI agents in
  SDLs.
limitations:
- Review; no quantitative metric definitions verified.
- Only abstract-level content was accessible; detailed requirement definitions (Table 1, eras) rest on secondary
  sources.
