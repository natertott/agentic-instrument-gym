summary: |
  Review tracing a decade of SDLs from narrowly focused automation tools to multipurpose discovery platforms in which algorithms propose, execute and interpret experiments with limited human intervention. Frames the next phase around three interdependent requirements -- scalability, generalizability and provenance-complete experimentation -- as prerequisites for SDLs that reliably scale throughput and transfer workflows and learned models across laboratories toward 'collective scientific superintelligence'.
schema_axes_proposed:
- Scalability (reliably scaling throughput; physical/agent extensibility; remote and distributed operation)
- Generalizability (transfer of workflows and learned models across laboratories; device and protocol abstraction)
- Provenance-complete experimentation (comprehensive structured (meta)data; interoperable data and metadata standards;
  ontology integration)
- Modular hardware
- Trustworthy AI agents that reason under uncertainty within rigorous safety and ethical bounds
- Cross-lab transferability / SDLs as shared scientific infrastructure (vs 'faster silos')
