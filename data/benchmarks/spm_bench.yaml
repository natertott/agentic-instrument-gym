summary: |
  A PhD-level multimodal benchmark of 2,703 image-QA pairs synthesised from 2023–2025 arXiv and journal papers covering STM, AFM, SEM and TEM images, generated by a VLM-instructed pipeline with an Anchor-Gated Sieve page filter and an advisory-model audit. Multi-select questions are scored with exact match, standard partial credit and a hallucination-penalising SIP-F1; the best model (qwen3.5-plus) reaches EM 0.832 / SIP-F1 0.881 and defect/topology reasoning is the weakest area.
