summary: |
  An open-source Gymnasium benchmark of 15 physics-simulated STEM 'worlds' (5 materials x 3 difficulty levels) with four characterization tasks, scoring agents by the area under a dose-efficiency curve (DEC-AUC). Across 33 agent configurations the perception ('analyst') pipeline, not the navigation policy, dominated dose efficiency; production vision-language models underperformed task-specific CNNs by ~13x on crystallographic defect analysis.
