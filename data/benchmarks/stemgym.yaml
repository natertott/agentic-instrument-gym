  headline_results:
  - CNN analyst + naive raster scanning raised DEC-AUC 5.5x over a CNN-free raster baseline (0.287 vs 0.052); Bayesian
    or adaptive-FSM navigation gave no statistically significant further gain.
  - Production VLMs underperformed task-specific CNNs by ~13x on crystallographic defect analysis.
