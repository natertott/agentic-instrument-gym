summary: |
  A Model-Context-Protocol framework in which a commercial LLM (Claude Sonnet 4.5 per the arXiv HTML snippet) controls several TEM subsystems, a data-management platform and HPC resources via four MCP servers using text instructions. The paper demonstrates set-up and completion of intricate TEM workflows without additional model training; no quantitative benchmark is reported in the abstract.
