summary: |
  A private OpenAI evaluation in which PhD scientists (virology, genetics, microbiology, protein engineering) transcribed protocols they personally used (substantially altered if adapted from publications) and wrote three troubleshooting questions each, describing a subtle realistic execution error and the resulting failed outcome. It targets tacit, hands-on knowledge not available online, in contrast to ProtocolQA.
