summary: |
  Simulation study of whether IRT estimation tools built for human testing remain reliable in the AI-benchmark regime (few evaluated models, very many items, skewed/clustered/multimodal capability distributions). Using item parameters and ability distributions from six LLM benchmarks, three IRT models and four estimators (marginal maximum likelihood, MCMC, variational inference, neural pseudo-Siamese) across 18,000 conditions, it finds classical estimators can be infeasible at benchmark scale while scalable estimators yield unreliable item-level and ranking inferences with small or non-normal model sets, and identifies the sample sizes and diagnostics needed for trustworthy use.
schema_axes_proposed:
- Number of evaluated models (system sample size) as a validity condition for item-level statistics
- Number of items relative to models (regime mismatch vs human testing)
- Shape of the capability distribution (skewed / clustered / multimodal vs normal)
- 'Estimator choice: MML; MCMC; variational inference; neural pseudo-Siamese (PSN-IRT)'
- IRT model choice (three common models, e.g. 1PL/2PL/3PL -- exact set unverified)
- 'Reliability targets: model rankings; predicted performance; item characteristics (difficulty, discrimination)'
- Computational feasibility / scalability of estimation
- Diagnostics and minimum sample sizes before trusting IRT-based benchmark claims
