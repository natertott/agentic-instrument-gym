transfer_relevant_findings:
- Instrument-agent benchmarks typically evaluate a handful of agent configurations -- exactly the small, non-normal
  system samples where IRT item statistics are unreliable; a schema should record n_agent_configs so readers can
  judge whether item-level claims are trustworthy.
- Warns against over-interpreting per-task difficulty/discrimination estimates from small studies.
