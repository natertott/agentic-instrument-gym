summary: |
  VISION (Virtual Scientific Companion) is a modular LLM-based assistant deployed at the NSLS-II 11-BM CMS X-ray scattering beamline. It chains "cognitive blocks" (cogs) for transcription, intent classification, beamline-code generation (Op), data analysis (Ana), refinement and scientific Q&A, executing generated Bluesky code on the beamline workstation; it demonstrated the first voice-controlled experiment at an X-ray scattering beamline. It is a system paper, but the repository ships per-cog test datasets (classifier, op, ana, voice) that later became the EnvTrace benchmark.
