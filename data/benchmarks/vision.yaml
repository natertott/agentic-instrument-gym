transfer_relevant_findings:
- Modular cog design lets models be swapped as they improve; classification-then-specialist routing keeps prompts
  small and latency low
- The system's test datasets seeded a later execution-trace benchmark (EnvTrace), showing how a deployed assistant
  can be turned into a benchmark
limitations:
- System/demo paper; evaluation is per-component and not a standardized benchmark
- Single beamline and facility-specific API
