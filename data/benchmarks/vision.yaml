notes: |
  Cog names (VOICE, CLASSIFIER, OP, ANA, REFINE, GPCAM, XICAM, VERIFIER) and model lists come from the public repo (backend/src/hal_beam_com/utils.py). arXiv and IOP pages were blocked, so the paper's reported accuracy/latency figures, number of test prompts, and whether a human baseline exists are unverified (null). License file not seen in repo listing. Journal citation from repo README BibTeX. Authors: Shray Mathur, Noah van der Vleuten, Kevin G. Yager, Esther H. R. Tsai.
