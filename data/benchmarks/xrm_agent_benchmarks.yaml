id: xrm_agent_benchmarks
record_type: benchmark
inclusion: core
inclusion_reason: benchmark with a reported task count, a named metric and verified extraction
name: Agentic self-driving microscopy benchmarks support qualification but do not necessarily generalize to unseen
  tasks
short_name: XRM agent benchmarks
year: 2026
venue: arXiv preprint (cs.AI; cross-listed cond-mat.mtrl-sci, cs.LG); posted 2026-08-05; 20 pages, 8 figures
authors_short: Johnson & Abshire
arxiv: '2608.05266'
doi: 10.48550/arXiv.2608.05266
url: https://arxiv.org/abs/2608.05266
code_url: https://github.com/natertott/agentic_microscopy_benchmarks_XRM
data_url: https://github.com/natertott/agentic_microscopy_benchmarks_XRM (benchmark YAMLs, SI PDF, notebooks, full_suite_optimal_configs.zip
  run logs; README also references a sweep_results.zip with all 1,949 runs that is NOT present in the cloned repository)
license: MIT (repository LICENSE, (c) 2026 Nathan Johnson); paper license not verified
status: preprint
summary: |
  A benchmark and trace-logging framework for LLM agents that operate a ZEISS Versa lab X-ray microscope (XRM) through LangGraph + six Python MCP servers. 53 YAML-defined tests (atomic instrument actions up to end-to-end setup/centering/sizing/geometry/recipe/shutdown workflows) were run under 105 agent configurations (1-, 2-, 3-agent topologies, five LLMs, RAG/context/sampling parameters, operational limits), giving 1,949 runs and 49,109 logged RAG retrievals. Configurations differed clearly in pass rate, latency, tokens, cost and failure mode, but surrogate models (L2 logistic regression, random forest) trained on configuration + test features predicted success on held-out tests at ROC-AUC ~0.55 (near chance) versus ~0.78 when test identity was available, so the authors conclude such benchmarks support qualification, regression testing, diagnosis and direct comparison but not a task-independent global configuration model.
schema_axes_proposed:
- Agent graph topology (one-, two-, three-agent); agent responsibilities and delegation rules
- Choice of LLM (five evaluated)
- Retrieval-augmented generation and context parameters
- Operational constraints
- 'Per-run observables: latency, token use, cost, failure mode (trace logging)'
- 'Benchmark purpose classes: qualification; regression testing; diagnosis; direct comparison; (vs) prediction of
  unseen-task performance'
- Seen vs unseen task split as the test of generalization
benchmark_features:
  agents_evaluated:
  - LangGraph one-agent ReAct controller
  - two-agent supervisor + unified worker
  - three-agent supervisor + instrument worker + image-analysis worker
  - 'LLM identifiers found in released data/notebooks: claude-sonnet-4, claude-3-7-sonnet, claude-opus-45, gpt-41,
    gpt-51, gpt-54 (paper says ''five LLMs''; framework sweep notebook lists exactly five: claude-3-7-sonnet, claude-opus-45,
    claude-sonnet-4, gpt-41, gpt-51; gpt-54 appears in the broad sweep)'
  evaluation_target:
  - instrument_control
  - protocol_planning
  - data_analysis
  - code_generation
  - safety
  execution_mode: physical_instrument
  has_abstention_eval: false
  has_human_baseline: false
  has_safety_eval: true
  headline_results:
  - '105 configurations, 1,949 runs, 53 tests, 49,109 RAG retrievals (paper); notebook raw load before exclusions:
    1,989 runs x 77 columns, 114 configs, 58 tests incl. 5 validation tasks, overall pass rate 72.7%.'
  - 'Surrogate ROC-AUC (notebook output): config-held-out with test_id: logistic 0.542, random forest 0.787 (Brier
    0.171, acc 0.785); task-grouped with test_id: LR 0.534, RF 0.594; strict unseen-task without test_id: LR 0.545,
    RF 0.577 -> paper reports ~0.55 for both, i.e. near chance.'
  - Test identity was the strongest predictor of pass/fail, followed by LLM choice and number of agents.
  - One- and two-agent topologies spanned similar pass-rate ranges; one-agent used up to ~10,000 fewer tokens per
    test; three-agent gave no consistent gain and was dropped from the broad sweep; two-agent systems exceeded duration/LLM-call/tool-call
    limits more often.
  - 'Framework sweep: 540 runs = 3 topologies x 5 LLMs x 15 ''framework_sweep'' tests (notebook).'
  - RAG audit (Fisher exact + BH correction, volcano plot) flagged 'toxic' entries (e.g. createrecipeinstrument,
    errorhandling, modifyrecipeinstrumenttool, recipeexecutionacquisitioninstrument, segment3ddataimage, segmentimageotsuimage,
    xrayonprotocolinstrument) but pruning them did not consistently improve performance.
  - '(repo-computed) Claude Sonnet 4, T=0 full-suite repeats: baseline one-agent no-RAG 75.5/88.7/92.5%; optimal
    one-agent pruned-RAG 94.3/92.5/92.5%; optimal two-agent pruned-RAG 94.3/83.0/81.1% (+84.9/79.2% in sweep); two-agent
    full-RAG 77.4/83.0/86.8%.'
  - '(repo-computed) Held-out physical validation (5 tasks x 3 repeats): baseline 1/5,1/5,1/5; one-agent pruned-RAG
    3/5,4/5,4/5; two-agent pruned-RAG 3/5,3/5,1/5; two-agent full-RAG 1/5 x3; validation_005 (count 5 pores >1 mm
    in a 3D reconstruction) failed in every run, validation_004 (create+run recipe) passed in every run.'
  - '(repo-computed) mean tokens/test: one-agent no-RAG ~10.2k, one-agent pruned-RAG ~16.2k, two-agent ~20k; mean
    cost/test $0.03 vs $0.045 vs $0.06; mean LLM calls 4.3 vs 4.4 vs 7.4-7.8.'
  - 'Failure types over all runs (notebook): expected_tool 185 runs, max_tool_calls 135, max_llm_calls 89, max_duration
    81, expected_file 68, file_content 35, min_tool_calls 34, output_contains 14, expected_agent 5.'
  - 105 configurations, 1,949 runs, 49,109 RAG retrievals logged
  - One-agent and two-agent systems covered a similar range of pass rates; one-agent used up to ~10,000 fewer tokens
    per test
  - Three-agent topology gave inconsistent improvements and was excluded from the broader sweep
  - One-agent pruned-RAG was Pareto-optimal in prospective 53-test comparison; one-agent no-RAG baseline performed
    approximately as well
  - 'Surrogate ROC-AUC: configuration-held-out L2 logistic 0.54, random forest ~0.78; task-held-out L2 logistic
    0.53, random forest 0.55 (near chance)'
  - Two-agent runs more often exceeded duration/LLM-call/tool-call limits; one-agent runs more often failed trace-based
    checks
  - Clear differences in latency, token use, cost and failure mode between configurations
  - Surrogate models did not reliably predict an agent's performance on new, unseen tasks
  - Heterogeneous test suite does not support a task-independent global configuration model
  holdout_or_split_design: 'Three surrogate CV schemes (5-fold): (a) GroupKFold by config_hash with test_id in the
    design matrix (configuration held out); (b) grouped by test_id with test_id still in the matrix; (c) strict
    unseen-task CV: StratifiedGroupKFold by test_id, test_id removed from predictors, preprocessing fit within fold.
    Plus a prospective physical holdout of 5 validation tasks run 3x per selected configuration.'
  instruments:
  - name: ZEISS Xradia 630 Versa 3D X-ray microscope (tool outputs report instrument_model Xradia_630_Versa; paper
      says runs were collected on a simulator and multiple ZEISS Versa microscope models; vendor API XradiaPy.Core.XRM
      / XradiaPy.Recipe.Recipe)
    modality: microscopy
    real_or_simulated: real
  - name: ZEISS Versa simulator (mentioned in paper limitations; share of runs on simulator not stated)
    modality: microscopy
    real_or_simulated: simulated
  leakage_or_contamination_risk: Tests are natural-language prompts against a private vendor API, so pretraining
    contamination is unlikely; the main validity risks are (i) repeated runs of the same task+config are not independent,
    (ii) model/prompt/framework/code/software/hardware versions changed during data collection, (iii) RAG knowledge
    base was hand-curated for these workflows and pruned using retrospective associations with the same tests, (iv)
    'suspect' tests that pass everywhere (stress_001, tdp_004, wf_analyze_003) or nearly always fail were flagged/excluded
    in analysis.
  metric_types:
  - success_rate
  - time
  - cost
  - other
  n_agent_configs: 105
  n_instances_or_runs_reported: 1949
  n_task_families: 7
  n_tasks: 53
  open_source: true
  primary_metric: 'Composite pass rate (binary per run: all checks defined for the test must be satisfied - required
    tools, forbidden tools, required agent, required text output, file creation/contents, quantitative tolerance,
    min tool calls, and operational limits on duration/LLM calls/tool calls); reported with 95% Wilson CIs. Secondary:
    duration, input/output tokens, estimated API cost, LLM calls, tool calls, failure-type breakdown, RAG retrieval
    identifiers; a study-specific weighted efficiency score (pass rate 0.4, mean duration 0.15, mean tokens 0.15,
    LLM calls 0.1, tool calls 0.1, failures 0.1 per SI Table 6).'
  repetitions_per_task: 3 (full-suite repeats of the selected configurations); 1 for most historical sweep runs
  sampling_strategy: Seven hand-written YAML suites (qualification/regression + integrated workflows); configuration
    sweeps were historical and unbalanced ('not a complete factorial experiment'); a separate 5-task validation_holdout.yaml
    (defined independently of the 53 tests, with numeric tolerances) was used for prospective physical validation
    of surrogate-recommended configurations.
  scientific_domains:
  - materials characterization
  - lab-based X-ray microscopy / micro-CT
  - additively manufactured (3D-printed) test artifacts
  scoring_granularity: binary
  target_population: 'Tasks a ZEISS Versa X-ray microscope operator would issue to an agentic controller: instrument
    state queries, source/stage/objective/filter control, image acquisition, sample centering and sizing, geometry/magnification
    selection, recipe creation and execution, image analysis, and safe shutdown; framed as qualification/regression
    tests for one specific agentic microscope controller.'
  task_source: expert_curated
task_features:
  closed_loop_feedback: true
  perceptual_demand: structured_readout
  quantitative_tolerance: Most of the 53 tests check required/forbidden tool calls, min tool calls, files created
    and operational limits rather than numeric values; numeric tolerances are used in the 5 validation tasks (stage
    X 650+/-100 um, Y 11100+/-500 um, Z 0+/-100 um, source Z -87+/-10 mm, detector Z 50+/-10 mm; sample length 29+/-1
    (x,z) and +/-2 mm (y); optimal exposure 5.0+/-0.25 s per SI (YAML shows tolerance 1); number_of_defects == 5).
  reasoning_demand: mixed
  safety_criticality: medium
  task_taxonomy:
  - 'tdp_workflow.yaml (golden end-to-end suite, 6): setup_instrument_tdp, center_sample_tdp, estimate_size_tdp,
    calculate_magnification_tdp, create_run_recipe_tdp, end_testing_tdp'
  - 'integration_workflows.yaml (12): General Setup Workflow, Full Imaging Setup with X-rays, Acquire and Analyze
    Basic, Acquire and Create Histogram, Acquire and Segment, Rotation Survey, XY Position Survey, Acquire/Segment/Annotate,
    Transmission Calculation, Find Optimal Exposure, Complete Imaging Workflow, Multi-View Characterization'
  - 'unit_instrument.yaml (atomic instrument control, 19): xray_001-002, stage_001-008, obj_001-003, filter_001-003,
    acq_001-003'
  - 'geometry_recipe.yaml (6): geom_001 Calculate Magnification, geom_002 Recenter XY, geom_003 Recenter YZ, recipe_001
    Modify Recipe, recipe_002 Create Tomography Recipe, recipe_004 Create and Run Recipe'
  - 'regression_performance.yaml (8): reg_003 X-ray Already Off, reg_006 Multiple Operations Same Axis, reg_007
    Acquire with X-rays Off (safety), perf_001 Fast Status Query, perf_004 Quick Acquisition, perf_007 Multi-Step
    Workflow Performance, stress_001 Repeated Acquisitions, stress_002 Complex Multi-Agent Workflow'
  - 'unit_image.yaml (1): python_002 Image Statistics with Python'
  - 'debug.yaml (1): debug_001 smoke test (do nothing, route to FINISH)'
  - 'validation_holdout.yaml (5 held-out physical validation tasks, not part of the 53): setup_measure_initial_acquire,
    measure_sample_size, optimize_exposure, create_recipe_run, measure_tdp_defects'
  tool_composition: 'Six MCP servers: Versa instrument control (X-ray on/off, voltage/power, axis motion absolute/relative,
    objective/filter get/set, single and transmission-corrected acquisition writing TIFF + JSON sidecar), Versa-Recipe
    (modify/save/open/run .rcp recipes), Geometry/optics (calculate_geometry_for_pixel_size, recenter_xy/yz_from_sidecar
    with calibrated sign conventions and mechanical limits), ImageAnalysis (otsu_segment_properties, histogram_tiff,
    draw_centroid_bbox, tiff_info), FileReading (list/read/find JSON, text), python_executor (execute_python_code
    in subprocess). 33 distinct tool names appear in released runs, most used: single_acquisition, move_axis_absolute,
    execute_python_code, otsu_segment_properties, is_xray_on.'
  tool_interface:
  - mcp
  - python_api
  - natural_language
  workflow_depth: mixed
sample_environment_features:
  calibration_or_api_state_variation: Runs span a simulator and multiple ZEISS Versa instruments with changing software/hardware
    versions (uncontrolled covariate); geometry tools encode calibrated limits; tests include idempotency checks
    (turn X-rays off when already off) and acquire-with-X-rays-off behavior.
  environment_description: Windows workstation running the LangGraph controller and MCP servers against the ZEISS
    XradiaPy API of a Versa XRM; per-run workspace directories capture TIFFs, JSON sidecars, recipes, plots; benchmark
    runner enforces per-test timeouts (30-1000 s) and recursion/retry limits.
  injected_faults: false
  novelty_control: 'No sample novelty axis; ''unseen task'' generalization is tested by holding out test identities
    in CV and by 5 separately defined validation tasks on the same artifact. Encoded here as held_out_task: the
    5 validation tasks and the strict test-identity CV hold out tasks, not task families or samples.'
  sample_real_or_simulated: real
  sample_types:
  - 3D-printed test artifact ('tdp'), ~29 mm in x/y/z, containing 5 internal pores > 1 mm used as ground truth for
    the defect-count validation task
  signal_quality_variation: Not systematically varied; exposure-optimization tasks target ~5000 counts; binning
    2/4 and 0.5-2 s exposures specified in prompts.
  novelty_levels_tested:
  - seen_in_development
  - held_out_task
agent_features_evaluated:
  deterministic_execution: false
  guards_or_safety_layer: allowlist
  models:
  - claude-sonnet-4
  - claude-3-7-sonnet
  - claude-opus-45
  - gpt-41
  - gpt-51
  - gpt-54 (identifiers as logged; provider label 'openai-standard'; temperatures 0.0-0.75)
  multi_agent: true
  planner: react
  rag_or_memory: varied
  tools:
  - MCP tool calls to six Python servers (instrument, recipe, geometry, image analysis, file I/O, Python execution)
  - shared AgentState with bounded/pruned transcript and prior_summary compression (max_messages 50-100, max_tokens
    20000, 'smart' pruning)
  - RAG over curated microscopy knowledge entries (text-embedding-3-large; episodic_top_k 0-5, contextual_top_k
    0-1, chunk 250-1000, overlap 100-250, similarity threshold 0-0.8; full vs pruned knowledge base)
  verifier_or_self_debug: none
  vision_used: false
transfer_relevant_findings:
- 'Task-held-out surrogate prediction of pass/fail was near chance (ROC-AUC ~0.55) even though configuration-held-out
  prediction reached ~0.78: the benchmark supports interpolation over known tasks (qualification) but not extrapolation
  to unseen tasks.'
- Test identity dominated feature importance, i.e. intrinsic task difficulty explains most outcome variance; agent-configuration
  effects are secondary and task-conditional.
- 'Architecture effects were not universal: more agents raised tokens/calls/time without consistent accuracy gains;
  RAG pruning derived from retrospective associations did not reliably transfer.'
- Prospective physical validation on 5 new tasks showed large drops relative to the 53-test suite (e.g. ~93% ->
  60-80% for the best config, ~85% -> 20% for the baseline) and one task (3D defect counting) was never solved (repo-computed).
- 'The authors explicitly frame the result as qualification vs generalization: heterogeneous test suites do not
  license a task-independent global configuration model.'
- Benchmarks supported qualification, regression testing, diagnosis and direct comparison, but not a task-independent
  global configuration model
- Task-held-out surrogate models were near chance (AUC 0.53–0.55) — configuration signal did not transfer across
  task identity
- Test identity > LLM choice > number of agents in feature importance for pass outcome
- More agents did not buy reliability; they shifted failure modes toward resource-limit exhaustion
- 'Directly on-topic negative result: passing a heterogeneous instrument benchmark qualifies an agent but does not
  predict generalization -- a schema should label each benchmark''s intended purpose (qualification/regression/diagnosis/comparison
  vs generalization claim).'
- Trace-level metrics (latency, tokens, cost, failure mode) should be first-class fields.
limitations:
- Single instrument family (ZEISS Versa), single sample artifact, single vendor API; no cross-instrument or cross-sample
  transfer tested.
- Historical, unbalanced configuration sweep; versions of models/prompts/code/hardware changed during the study;
  repeated runs not independent.
- Binary composite pass criterion mostly checks trace/artifact conformance rather than scientific accuracy; few
  tests carry numeric tolerances.
- No vision-language perception (image analysis is via deterministic tools); no human baseline; no explicit safety-violation
  or abstention metric.
- Full 1,949-run sweep data (sweep_results.zip) and agent source/prompts referenced in SI are not present in the
  public repository as cloned on 2026-09-14; only optimal-config/baseline/validation runs (~1,800 results) are released.
- Historical, unbalanced configuration dataset rather than randomized factorial design
- Not every configuration run on every test; repeats not fully independent
- Versions of models, prompts, framework, software and hardware drifted during the study
- Single instrument family (ZEISS Versa XRM); agent code not released, only benchmark records and analysis scripts
- Claude Opus 4.5 affected by an implementation incompatibility in multi-agent graphs
- Only the abstract was accessible; instrument types, LLM names, task taxonomy and code availability unverified.
