  files), HF link. Search-snippet: 264/903 counts, 25/239 split, 114 multi-dataset tasks, six domain names,
  HMS definition, agent names, 24.5%/15.7% and per-domain numbers, ICLR 2025 venue (proceedings.iclr.cc file
  listed). Not verifiable: repetitions, n_agent_configs, exact paper count ('over 20'), DOI.
