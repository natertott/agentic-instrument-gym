  - "Oracle-feedback Reflexion nearly doubles other scaffolds, indicating verification signals matter more than base model"
  - "Synthetic tasks are harder than real ones for the same agent (15.7% vs 24.5%), and difficulty scales with workflow complexity"
  - "NoDataGuess control needed because published findings can be recalled without data"
limitations:
