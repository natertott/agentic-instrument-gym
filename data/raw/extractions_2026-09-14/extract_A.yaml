id: discoverybench
name: "DiscoveryBench: Towards Data-Driven Discovery with Large Language Models"
short_name: DiscoveryBench
year: 2024
venue: "ICLR 2025 (conference paper); arXiv preprint Jul 2024"
authors_short: "Bodhisattwa Prasad Majumder et al. (Allen Institute for AI)"
arxiv: "2407.01725"
doi: null
url: "https://arxiv.org/abs/2407.01725"
code_url: "https://github.com/allenai/discoverybench"
data_url: "https://huggingface.co/datasets/allenai/discoverybench (also in repo under discoverybench/real and discoverybench/synth)"
license: "ODC Attribution License (ODC-By) per repo LICENSE"
status: published
summary: >
  DiscoveryBench formalizes data-driven hypothesis search and verification: each task gives an agent one or more
  datasets with metadata and a natural-language discovery goal, and the agent must analyse the data and state a
  hypothesis (context, variables, relationship) that is compared to the gold hypothesis derived from a published
  paper. It has 264 real tasks (DB-REAL; 25 train / 239 test) manually derived from workflows in over 20 papers
  across six domains (sociology, biology, humanities, economics, engineering, meta-science) plus 903 synthetic
  tasks (DB-SYNTH) for controlled complexity studies. Evaluation uses an LLM-judged Hypothesis Matching Score;
  the best system (Reflexion with oracle feedback on GPT-4o) scores about 25%.
benchmark_features:
  evaluation_target: [data_analysis, code_generation, question_answering]
  execution_mode: hybrid
  instruments: []
  scientific_domains: ["sociology", "biology", "humanities (incl. archaeology)", "economics", "engineering (requirements engineering for ML systems)", "meta-science (meta-regression)"]
  n_tasks: 264
  n_task_families: 6
  n_instances_or_runs_reported: null
  repetitions_per_task: null
  target_population: "Real-world data-driven discovery tasks faced by researchers: from raw dataset(s) and a goal to a verified hypothesis, including data cleaning, statistical modelling and semantic interpretation"
  task_source: mixed
  sampling_strategy: "DB-REAL: authors manually extracted discovery goals, gold hypotheses and workflows from published papers with public data (e.g. NLS incarceration/SES/BMI, World Bank education-GDP, archaeology, invasive-plant introduction pathways, meta-regression, requirements engineering); 114 tasks require multiple datasets (up to 6). DB-SYNTH: LLM-generated hypotheses/datasets/workflows with systematic variation of complexity (repo has synth train/dev/test folders such as ancient-languages_0_3, astronomy_1_2 encoding complexity levels)"
  metric_types: [llm_judge, partial_credit, other]
  primary_metric: "Hypothesis Matching Score (HMS): LLM-judged alignment between predicted and gold hypotheses over context, variables and relationships, weighted by context F1"
  scoring_granularity: continuous
  has_human_baseline: false
  has_safety_eval: false
  has_abstention_eval: false
  holdout_or_split_design: "DB-REAL: 25 train / 239 test tasks; DB-SYNTH: train/dev/test folders (repo). Metadata files bundle several queries per dataset (repo: 144 real-test metadata files hold the 239 test queries)"
  leakage_or_contamination_risk: "Gold hypotheses come from published papers, so LLMs may recall findings without analysing data; the paper includes a 'NoDataGuess' baseline that answers without opening the data to screen for such leakage"
  agents_evaluated: ["CodeGen", "ReAct", "DataVoyager", "Reflexion (Oracle)", "NoDataGuess", "with GPT-4o, GPT-4-0125-preview, Llama-3-70B (repo also supports gpt-4-turbo, claude-3-opus, gemini-pro)"]
  n_agent_configs: null
  headline_results:
    - "Best system scores only 25% HMS overall"
    - "Reflexion (Oracle) + GPT-4o: 24.5% HMS on DB-REAL and 15.7% on DB-SYNTH; CodeGen, ReAct and DataVoyager between 5.7% and 16.3%"
    - "Per-domain (DB-REAL): biology 0%, engineering 7%, sociology 23%, economics 25%"
    - "Follow-up AutoSDT-Coder-32B raises HMS to 8.1 (17.4% relative gain) for an open-weight model"
  open_source: true
task_features:
  workflow_depth: multi_step
  perceptual_demand: structured_readout
  reasoning_demand: high
  tool_interface: [python_api, natural_language]
  tool_composition: "Agents iteratively write and execute Python analysis code (pandas/statsmodels-style) over CSVs, then verbalize a hypothesis; optional flags add domain knowledge or workflow tags to the prompt (repo: --add_domain_knowledge, --add_workflow_tags)"
  quantitative_tolerance: "No numeric tolerance; hypotheses are compared semantically (context/variables/relationship) by an LLM judge, so quantitative effect sizes are only assessed insofar as the judge deems the relationship equivalent"
  closed_loop_feedback: false
  safety_criticality: none
  task_taxonomy: ["DB-REAL vs DB-SYNTH", "workflow tags per task (e.g. time series analysis, data cleaning, data visualization, regression, meta-analysis)", "six domains: sociology, biology, humanities, economics, engineering, meta-science"]
sample_environment_features:
  sample_types: ["tabular CSV datasets from published studies (survey panels, economic indicators, archaeological artefact counts, pollen time series, meta-analysis tables) and LLM-synthesized tables"]
  sample_real_or_simulated: dataset
  signal_quality_variation: "Real datasets include raw and pre-processed variants (e.g. nls_raw vs nls_incarceration, meta_regression_raw vs meta_regression) so data-cleaning burden varies"
  novelty_control: "Train/test split on tasks; synthetic tasks provide unseen domains and controlled complexity"
  calibration_or_api_state_variation: null
  injected_faults: false
  environment_description: "Local Python execution with datasets on disk; metadata JSON supplies dataset descriptions, column descriptions, domain knowledge and queries; evaluation script compares predicted vs gold hypothesis (and optionally workflows)"
agent_features_evaluated:
