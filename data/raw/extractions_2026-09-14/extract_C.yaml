id: bioprobench
name: "BioProBench: A Corpus and Benchmark for Biological Protocol Reasoning in Autonomous Science (earlier title: Comprehensive Dataset and Benchmark in Biological Protocol Understanding and Reasoning)"
short_name: BioProBench
year: 2025
venue: "ICML 2026 (per official repo citation); arXiv 2025-05-11"
authors_short: "Yuyang Liu et al."
arxiv: "2505.07889"
doi: null
url: "https://arxiv.org/abs/2505.07889"
code_url: "https://github.com/YuyangSunshine/bioprobench"
data_url: "https://huggingface.co/BioProBench"
license: "CC BY-NC 4.0"
status: published
summary: >
  BioProBench is a large-scale multi-task benchmark for procedural reasoning over biological wet-lab protocols, built
  from BioProCorpus (22,413 human-written protocols from 5 repositories across 16 subdomains) into 523,784 instances
  across five tasks: Protocol QA, Step Ordering, Error Correction, Protocol Generation and Protocol Reasoning. Frontier
  LLMs score ~70-74% on QA but fall to ~50% exact-match on ordering and <15 BLEU on generation, with weak quantitative
  precision and safety awareness.
benchmark_features:
  evaluation_target: [protocol_planning, question_answering, safety]
