# extract_C.yaml — benchmarks for LLM agents controlling / reasoning about scientific instruments & lab workflows
# Extraction date: 2026-09-14. Sources are PRIMARY where reachable (GitHub READMEs, project pages) and otherwise
# search-engine excerpts of the arXiv abstract/HTML pages (arxiv.org, huggingface.co, aclanthology.org, biorxiv.org,
# openreview.net, semanticscholar.org were all blocked by the network egress proxy in this session).
# Any number sourced only from a search-result excerpt is flagged in `notes`.

id: labosbench
name: "LabOSBench: Benchmarking Computer Use Agents for Scientific Instrument Control"
short_name: LabOSBench
year: 2026
venue: "arXiv preprint (cs); no peer-reviewed venue identified"
authors_short: "Anqi Zou et al."
arxiv: "2606.16802"
doi: null
url: "https://arxiv.org/abs/2606.16802"
code_url: "https://github.com/Su-ISE-2001/LABOSBENCH"
data_url: "https://su-ise-2001.github.io/LABOSBENCH/"
license: "Per-component licenses (repo states it 'follows the original licenses of each submodule'; agent code partially forked from OSWorld). No single top-level license verified."
status: preprint
summary: >
  LabOSBench is a browser-based, executable benchmark for multimodal GUI / computer-use agents that must operate
  eight web simulators of scientific instruments (SEM, TEM, LFM, XRD, EDS, APT, FIB, SPM) through realistic
  control panels (sliders, toggles, live plots, status indicators). It defines 96 subtasks spanning sample loading,
  alignment, parameter tuning, data acquisition and result inspection, plus full-workflow (end-to-end) episodes,
  and scores agents with execution-based state checks. Strong general multimodal models complete many structured
  subtasks but collapse on feedback-driven adjustment, scientific-state interpretation and long-horizon execution.
benchmark_features:
  evaluation_target: [computer_use, instrument_control, perception]
  execution_mode: simulator
  instruments:
    - {name: "Scanning Electron Microscope (SEM) web simulator", modality: microscopy, real_or_simulated: simulated}
    - {name: "Transmission Electron Microscope (TEM) web simulator", modality: microscopy, real_or_simulated: simulated}
    - {name: "Light/Fluorescence Microscope (LFM) web simulator", modality: microscopy, real_or_simulated: simulated}
    - {name: "X-Ray Diffraction (XRD) web simulator", modality: diffraction, real_or_simulated: simulated}
    - {name: "Energy-Dispersive Spectroscopy (EDS) web simulator", modality: spectroscopy, real_or_simulated: simulated}
    - {name: "Atom Probe Tomography (APT) web simulator", modality: spectroscopy, real_or_simulated: simulated}
    - {name: "Focused Ion Beam (FIB) web simulator", modality: microscopy, real_or_simulated: simulated}
    - {name: "Scanning Probe Microscope (SPM) web simulator", modality: microscopy, real_or_simulated: simulated}
  scientific_domains: ["materials characterization", "electron microscopy", "light/fluorescence microscopy", "diffraction and spectroscopy", "micro/nano-fabrication", "scanning probe microscopy"]
  n_tasks: 96
  n_task_families: 8
  n_instances_or_runs_reported: null
  repetitions_per_task: "Paper (per search excerpt): per-instrument subtask scores average over two runs per subtask. Repo example commands use --runs 5 as a configurable parameter."
  target_population: "Operator-level GUI control of high-precision scientific instruments (microscopy imaging, diffraction/spectroscopic analysis, micro-nano fabrication/manipulation) as encountered in real instrument software"
  task_source: expert_curated
  sampling_strategy: "Authors built eight high-fidelity interactive web environments and hand-defined subtasks per instrument (FIB 20, SEM 12, EDS 8, APT 12, LFM 12, SPM 14, TEM 10, XRD 8 = 96). Subtasks are chained into full workflows per instrument. Each task is issued as a natural-language instruction."
  metric_types: [success_rate, partial_credit, other]
  primary_metric: "Average subtask score (execution-based subtask success averaged across subtasks and runs); secondary: end-to-end episode success rate (all required subtasks completed within step budget)"
  scoring_granularity: mixed
  has_human_baseline: true
  has_safety_eval: false
  has_abstention_eval: false
  holdout_or_split_design: "None described; all 96 subtasks are public in the repo (Git LFS). No train/test split."
  leakage_or_contamination_risk: "Simulators and task definitions are fully public on GitHub (created 2026-06-15); simulators are custom-built (Go backend + static web frontends), so pre-training contamination of the exact GUIs is unlikely, but future fine-tuning on the released environments is possible."
  agents_evaluated: ["Qwen3VL-32B", "EvoCUA-8B", "Claude Sonnet-4.5", "Kimi-K2.5", "Seed-1.6", "GPT-5.5", "Claude Opus-4.5", "UI-TARS-1.5-7B", "GUI-Owl-7B", "GTA1 w/ GPT-5.5", "VLAA-GUI w/ Claude Opus-4.5", "Hippo Agent w/ Claude Opus-4.5"]
  n_agent_configs: 12
  headline_results:
    - "Human performance: 0.924 average subtask score"
    - "Best agent: GTA1 w/ GPT-5.5, 0.814 average subtask score"
    - "General-purpose models Seed-1.6 (0.763) and GPT-5.5 (0.726) beat most specialized GUI agents"
    - "Specialized GUI / small models (per BenchmarkList mirror of the paper table): UI-TARS-1.5-7B 0.35, EvoCUA-8B 0.35, GUI-Owl-7B 0.325, Qwen3VL-32B 0.275"
    - "End-to-end (full workflow) success for GPT-5.5: EDS 70.0%, APT 80.0%, XRD 60.0%; 0% on SEM, SPM, TEM, LFM, FIB; average end-to-end success only 26.3% vs much higher subtask-level scores (severe error accumulation)"
  open_source: true
task_features:
  workflow_depth: mixed
  perceptual_demand: image_interpretation
  reasoning_demand: mixed
  tool_interface: [gui]
  tool_composition: "Single instrument GUI per task; agent perceives screenshots and emits mouse/keyboard actions via a Playwright-driven Chromium browser (OSWorld-derived agent harness). No API/CLI shortcuts."
  quantitative_tolerance: "Execution-based checkers on logged simulator state; the paper states it can evaluate intermediate scientific-state quality (e.g., focus/alignment/image adjustment) rather than only final completion. Exact tolerances not verified."
  closed_loop_feedback: true
  safety_criticality: low
  task_taxonomy:
    - "Three experimental paradigms: (i) advanced microscopy imaging (SEM, TEM, LFM); (ii) diffraction and spectroscopic analysis (XRD, EDS, APT); (iii) precision micro-nanofabrication and manipulation (FIB, SPM)"
    - "Workflow stages: sample loading, alignment, parameter tuning, data acquisition, result inspection"
    - "Evaluation levels: subtask-level vs full-workflow (end-to-end episode)"
    - "Qualitative task classes discussed: structured operations with clear feedback and short action sequences (EDS, XRD) vs feedback-driven focusing / image-quality adjustment / long procedures / fine-grained operations / visual target localization (SEM, FIB, LFM)"
sample_environment_features:
  sample_types: ["virtual specimens rendered by each simulator (details not verified)"]
  sample_real_or_simulated: simulated
  signal_quality_variation: "Simulators render dynamic plots and image states that change with parameters (focus, alignment, image quality); explicit noise/quality randomization not verified."
  novelty_control: "Custom-built simulators not seen in pre-training; no explicit novelty split."
  calibration_or_api_state_variation: null
  injected_faults: null
  environment_description: "Eight interactive web apps (Go backend 'simulator-master' + static frontends) preserving domain-specific control modalities: multi-dimensional sliders, discrete toggles, real-time dynamic plots, multi-state status indicators. Runs in a standard browser on port 8080; no OS-level virtualization. Observations: screenshots plus logged simulator state."
agent_features_evaluated:
  models: ["GPT-5.5", "Claude Opus-4.5", "Claude Sonnet-4.5", "Seed-1.6", "Kimi-K2.5", "Qwen3VL-32B", "EvoCUA-8B", "UI-TARS-1.5-7B", "GUI-Owl-7B"]
  vision_used: true
  rag_or_memory: none
  planner: varied
  tools: ["Playwright browser actions (click/type/scroll) on simulator GUI"]
  verifier_or_self_debug: varied
  guards_or_safety_layer: none
  multi_agent: false
  deterministic_execution: null
transfer_relevant_findings:
  - "Subtask competence does not transfer to workflow competence: GPT-5.5 scores 0.726 on average subtasks but 26.3% end-to-end, with 0% on five of eight instruments."
  - "Task difficulty tracks feedback structure, not instrument prestige: EDS/XRD/APT (structured operations, clear feedback, short sequences) are solvable; SEM/FIB/LFM (feedback-driven focusing, image-quality adjustment, long procedures, fine-grained visual localization) are not."
  - "General-purpose frontier VLMs outperform GUI-specialized 7-8B models by a wide margin (0.73-0.76 vs 0.28-0.35), and wrapping a frontier model in an agentic GUI framework (GTA1) adds further gains (0.814)."
  - "A human baseline of 0.924 shows the tasks are well-posed for operators, so the gap is agent capability, not task ambiguity."
limitations:
  - "Web simulators, not physical instruments: cannot capture hardware latency, calibration uncertainty, safety constraints, or real laboratory failure modes (authors' statement)."
  - "Covers a selected set of instruments (microscopy, spectroscopy, diffraction, tomography); excludes wet-lab protocols, robotic manipulation, chemical synthesis, multi-instrument experimental planning (authors' statement)."
  - "Evaluation relies on screenshots and logged simulator states; some scientific decisions may require richer observations, domain knowledge or multimodal sensor signals (authors' statement)."
  - "Repo is early-stage (3 commits; unified CLI, Docker, VLAA-GUI/Hippo baselines and cross-subtask memory evaluation listed as 'coming soon')."
related: [labos_coscientist, afmbench, agentic_microscopy_benchmarks_xrm, spm_bench]
notes: >
  arXiv abstract/HTML pages were egress-blocked; title, author list (Anqi Zou, Han Deng, Chengyu Zhang, Junquan Hu,
  Yu Wang, Yuxiang Xing, Aokai Zhang, Hanling Zhang, Zhaoyang Liu, Ben Fei, Zhihui Wang, Wanli Ouyang), abstract
  claims, the 3-paradigm taxonomy, baseline list, headline numbers (0.924 human, 0.814 GTA1, 0.763 Seed-1.6, 0.726
  GPT-5.5, 26.3% end-to-end, per-instrument 70/80/60%) and the limitations paragraph come from search-engine excerpts
  of arxiv.org/html/2606.16802 and should be re-checked against the PDF. The arXiv abstract title uses 'for';
  the HTML version title reads 'towards'. Per-instrument subtask counts, Playwright/OSWorld architecture, run
  parameters and license statement were verified directly from the GitHub README (Su-ISE-2001/LABOSBENCH, created
  2026-06-15). The 0.35/0.325/0.275 small-model scores come from a third-party mirror (benchmarklist.com) quoted in a
  search excerpt. Author affiliations, submission date, exact step budget, and the exact subtask-checker definitions
  could not be verified. There is no evidence LabOSBench is affiliated with the LabOS AI-XR co-scientist project;
  the shared name appears coincidental (different author groups; LabOS README does not mention LabOSBench).
---
id: labos_coscientist
name: "LabOS: The AI-XR Co-Scientist That Sees and Works With Humans"
short_name: LabOS
year: 2025
venue: "arXiv / bioRxiv preprint (also posted on Research Square)"
authors_short: "Zaixi Zhang et al. (first author inferred from GitHub owner; full list not verified)"
arxiv: "2510.14861"
doi: "10.1101/2025.10.16.679418"
url: "https://arxiv.org/abs/2510.14861"
code_url: "https://github.com/zaixizhang/LabOS"
data_url: null
license: "Apache-2.0 (code)"
status: preprint
summary: >
  LabOS is a system paper, not primarily a benchmark: an AI co-scientist combining a self-evolving multi-agent
  reasoning stack (planning/manager, researcher/development, critic, tool-creation agents drawing on a 'Tool Ocean'
  of autonomously generated tools) with XR smart-glasses interfaces for human-in-the-loop physical lab execution.
  It introduces LabSuperVision, a VLM benchmark of 200+ egocentric lab video sessions with protocols, step segments
  and expert-labeled error events, and reports results on HLE-Biomedicine, LAB-Bench subsets and wet-lab error detection.
benchmark_features:
  evaluation_target: [perception, question_answering, protocol_planning]
  execution_mode: hybrid
  instruments:
    - {name: "XR smart glasses / fixed cameras observing human wet-lab work", modality: generic_lab, real_or_simulated: real}
  scientific_domains: ["biomedicine", "cancer immunotherapy target discovery", "mechanistic cell biology", "materials science labs (LabSuperVision)"]
  n_tasks: null
  n_task_families: null
  n_instances_or_runs_reported: null
  repetitions_per_task: null
  target_population: "Human-AI collaborative biomedical research spanning hypothesis generation, experimental design, physical validation and documentation"
  task_source: mixed
  sampling_strategy: "LabSuperVision: >200 egocentric video sessions (2-45 min) recorded during real experiments across biomedical and materials-science labs via fixed cameras and XR glasses; each with gold-standard protocol, step segments, expert-labeled error events and critical parameters."
  metric_types: [success_rate, other]
  primary_metric: "Accuracy on external QA benchmarks (HLE-Biomedicine, LAB-Bench DBQA/LitQA) and wet-lab error-detection accuracy (LabSuperVision)"
  scoring_granularity: mixed
  has_human_baseline: null
  has_safety_eval: false
  has_abstention_eval: false
  holdout_or_split_design: null
  leakage_or_contamination_risk: "LabSuperVision videos are newly recorded; external benchmarks (LAB-Bench, HLE) are public."
  agents_evaluated: ["LabOS (multi-agent, Gemini 3 backbone via OpenRouter per current README)", "unnamed commercial systems as comparators"]
  n_agent_configs: null
  headline_results:
    - "Humanity's Last Exam - Biomedicine: 32% (+8% vs next best) [GitHub README]"
    - "LAB-Bench DBQA: 61% (top score); LAB-Bench LitQA: 65% (top score) [GitHub README]"
    - "Wet-lab error detection: >90% vs ~40% for commercial systems [GitHub README]"
  open_source: true
task_features:
  workflow_depth: long_horizon
  perceptual_demand: image_interpretation
  reasoning_demand: high
  tool_interface: [python_api, natural_language, physical]
  tool_composition: "Tool Ocean of 98 biomedical tools across seven categories (databases, screening, sequence analysis, search, development environments, web utilities, biosecurity) orchestrated by four agents; XR glasses stream video to VLM for step tracking / error flagging."
  quantitative_tolerance: null
  closed_loop_feedback: true
  safety_criticality: medium
  task_taxonomy: ["hypothesis generation", "experimental design", "data analysis", "physical validation with XR guidance", "automated documentation", "wet-lab error detection (LabSuperVision)"]
sample_environment_features:
  sample_types: ["real biological samples in human-operated wet labs"]
  sample_real_or_simulated: real
  signal_quality_variation: "Egocentric video from diverse labs and camera setups"
  novelty_control: null
  calibration_or_api_state_variation: null
  injected_faults: null
  environment_description: "Real biomedical and materials labs; humans execute protocols wearing XR glasses while agents observe, reason and guide."
agent_features_evaluated:
  models: ["Gemini 3 (current README); models at time of paper not verified"]
  vision_used: true
  rag_or_memory: some
  planner: plan_and_execute
  tools: ["Tool Ocean (98 tools)", "web search", "literature retrieval", "bioinformatics databases"]
  verifier_or_self_debug: verifier
  guards_or_safety_layer: some
  multi_agent: true
  deterministic_execution: false
transfer_relevant_findings:
  - "Claims a lab-specific VLM benchmark (LabSuperVision) yields visual reasoning that surpasses general-purpose models on lab-specific tasks — i.e., domain video data matters for perception of lab state."
  - "System-level rather than benchmark-level evidence; useful mainly as a source of the LabSuperVision perception benchmark and as context for the (unrelated) LabOSBench name."
limitations:
  - "Primarily a system/demonstration paper; evaluation numbers are reported by the authors on their own README without full tables verified here."
  - "LabSuperVision task definitions, metrics and release status could not be verified (HF/bioRxiv blocked)."
related: [labosbench, lab_bench]
notes: >
  Distinct from LabOSBench (different authors; LabOS README does not mention LabOSBench). arXiv, bioRxiv,
  alphaXiv, ResearchGate, Research Square and ai4labos.com were all egress-blocked; facts come from the GitHub README
  (verified) and search excerpts of the bioRxiv/arXiv abstract. Full author list, exact submission date (bioRxiv DOI
  implies 2025-10-16), and LabSuperVision metrics unverified. 'Tool Ocean' size (98 tools) reflects the current
  README and may differ from the paper.
