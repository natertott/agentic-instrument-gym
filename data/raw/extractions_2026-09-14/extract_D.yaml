id: eaa_experiment_automation_agents
name: "Experiment automation agents: automating materials characterization with vision language model agents"
short_name: EAA
year: 2026
venue: "npj Computational Materials (2026); arXiv Feb 2026"
authors_short: Du et al.
arxiv: "2602.15294"
doi: 10.1038/s41524-026-02213-8
url: https://www.nature.com/articles/s41524-026-02213-8
code_url: https://github.com/AdvancedPhotonSource/EAA
data_url: null
license: null
status: published
summary: >
  EAA is a vision-language-model agent runtime for scientific instruments, built on LangGraph task managers with
  tool calling, an image-follow-up mechanism so the model can see images returned by tools, optional Chroma-based
  long-term memory, and two-way MCP compatibility (consume instrument MCP servers; serve EAA tools to Claude Code /
  Gemini CLI). It was demonstrated at an Advanced Photon Source imaging beamline for automated zone-plate focusing,
  natural-language feature/ROI search and interactive data acquisition, spanning fully agent-driven to logic-defined
  workflows with embedded LLM queries.
