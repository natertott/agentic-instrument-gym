  tool_composition: "Task managers (ScanningMicroscopeFocusingTaskManager, MultiAgentROISearchTaskManager, feature tracking, optics tuning, MonitoringTaskManager; logic-defined AnalyticalScanningMicroscopeFocusingTaskManager) call acquisition, registration, line-scan and parameter-tuning tools; instrument control served as external MCP/HTTP servers (MCPRPCWrapper for logic workflows); serial tool execution; optional approval gate (require_approval=True)"
