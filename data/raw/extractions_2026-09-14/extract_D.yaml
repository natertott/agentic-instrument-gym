# extract_D.yaml — LLM agents controlling synchrotron beamlines / X-ray instruments
# Sourcing note: arXiv, publisher sites (Nature, IOP, IUCr, AIP, APS), OSTI, Zenodo and all
# paper mirrors were blocked by the network egress proxy in this session. Facts below come from
# (a) WebSearch result snippets that quote arXiv/publisher pages, and (b) primary GitHub
# repositories (READMEs, docs, datasets, test code) which were reachable. Anything not
# confirmed by one of those is null with an explanation in `notes`.

id: envtrace
name: "EnvTrace: Simulation-Based Semantic Evaluation of LLM Code via Execution Trace Alignment -- Demonstrated at Synchrotron Beamlines"
short_name: EnvTrace
year: 2025
venue: arXiv preprint (cs.SE / cs.AI); journal status not verified
authors_short: van der Vleuten et al.
arxiv: "2511.09964"
doi: null
url: https://arxiv.org/abs/2511.09964
code_url: https://github.com/CFN-softbio/EnvTrace
data_url: https://zenodo.org/records/17526264
license: Apache-2.0 (EnvTrace package); dataset/Zenodo license not verified
status: preprint
summary: >
  EnvTrace evaluates LLM-generated instrument-control code by executing both the generated code and a
  ground-truth reference inside a sandboxed beamline "control-logic digital twin" (Bluesky/IPython driving
  EPICS IOCs in Docker) and aligning the resulting execution traces (time-stamped EPICS PV state changes)
  rather than comparing code text. Traces are scored on state (discrete sequence), temporal, continuous-profile
  and structural equivalence, yielding a continuous "full score" and a strict binary "EnvTrace accuracy".
  Over 30 LLMs were benchmarked on natural-language-to-beamline-code tasks from the VISION system at NSLS-II,
  with top closed models approaching beamline-scientist (human) performance.
benchmark_features:
  evaluation_target: [code_generation, instrument_control, simulation_control]
  execution_mode: execution_trace
  instruments:
    - {name: "NSLS-II 11-BM CMS beamline control-logic digital twin (Bluesky/ophyd + EPICS IOCs in Docker: sample motors, Linkam-style temperature stage, detector exposure)", modality: synchrotron, real_or_simulated: digital_twin}
  scientific_domains: [synchrotron X-ray scattering (GISAXS/SAXS), beamline operations, soft-matter thin films]
  n_tasks: 136
  n_task_families: 2
  n_instances_or_runs_reported: null
  repetitions_per_task: "Repo tooling defaults to num_runs=3 per model (run_all_models_comparison.py); the number used in the paper's tables was not verified"
  target_population: "Natural-language beamline-operation commands a user would issue to a voice/text assistant at an X-ray scattering beamline (motor moves, alignment, incident angle, exposures, temperature ramps, scans, loops)"
  task_source: expert_curated
  sampling_strategy: "Beamline-scientist-authored command/code pairs from the VISION Op-cog dataset; split into 'simple-flow' commands and 'complex-flow' (loops, conditionals, temperature ramps, multi-axis scans) plus generic Bluesky plans"
  metric_types: [trace_alignment, success_rate, partial_credit, time, other]
  primary_metric: "EnvTrace accuracy (binary: exact discrete-state match AND timing thresholds R^2>=0.9, slope in [0.8,1.2] AND continuous-profile thresholds) with a continuous 'full score' (0.8*discrete + 0.2*timing, or 0.6*discrete + 0.2*timing + 0.2*continuous when continuous channels exist)"
  scoring_granularity: mixed
  has_human_baseline: true
  has_safety_eval: false
  has_abstention_eval: false
  holdout_or_split_design: "No train/test split; a fixed evaluation set. Dataset revised after the paper (op_cog_dataset_after_envtrace_paper_fixes.json)."
  leakage_or_contamination_risk: "Dataset and ground-truth code are public on GitHub (CFN-softbio/VISION) and Zenodo; prompts are short, domain-specific NL commands with facility-specific Python API (e.g., sam.xr(), sam.measure()), so verbatim pretraining contamination is unlikely but possible for post-2025 models."
  agents_evaluated: [Claude 3.5 Sonnet, Claude Sonnet 4, Claude Sonnet 4 (thinking), Claude Opus 4, Claude Sonnet 4.5, GPT-4o, o3, GPT-5 (minimal/low/high reasoning), Gemini 2.5 Pro, Grok-4, Grok-4-fast, grok-code-fast-1, Devstral Medium, Qwen3, Qwen3-thinking, Qwen3-coder, Qwen2, Qwen2.5, Qwen2.5-coder, Mistral, Mistral-Nemo, Phi-3.5, Athene-v2, Llama 3.3, gpt-oss-120b]
  n_agent_configs: 31
  headline_results:
    - "Over 30 LLMs evaluated; 'many top-tier models can approach human-level performance in rapid control-code generation' (abstract)"
    - "Top-tier closed-source models (Anthropic Claude series, xAI Grok-4, OpenAI GPT-5, GPT-4o) performed best (search-snippet summary of paper); per-model numeric scores could not be retrieved"
    - "Evaluation set described as 116 simple-flow commands + 20 complex-flow control examples plus generic Bluesky plans"
  open_source: true
task_features:
  workflow_depth: mixed
  perceptual_demand: none
  reasoning_demand: mixed
  tool_interface: [python_api, cli]
  tool_composition: "Single code snippet generated per NL command, executed in an IPython/Bluesky session that drives EPICS PVs; complex tasks compose motor moves, exposures, temperature control and timing loops in one script"
  quantitative_tolerance: "Timing: R^2>=0.9, slope 0.8-1.2, duration tolerance 25%, MAPE tolerance 100%; temperature profile: MAE<=5.0 C and final-temperature diff<=5.0 C for binary match; per-channel numeric comparators configurable; ignore_pvs lists per task"
  closed_loop_feedback: false
  safety_criticality: medium
  task_taxonomy: [simple-flow commands, complex-flow control (loops, conditionals, temperature ramps, multi-axis scans), generic Bluesky plans]
sample_environment_features:
  sample_types: [thin film, perovskite, polymer, organic thin film (named only in prompts; no physical sample)]
  sample_real_or_simulated: none
  signal_quality_variation: null
  novelty_control: "None described; fixed public dataset"
  calibration_or_api_state_variation: "Motors reset to default positions (caput, .SET teleport) before each test; temperature PV monitored over time"
  injected_faults: false
  environment_description: "Sandboxed interactive IPython session (managed via pexpect) with Bluesky RunEngine and beamline profile collection, talking to simulated EPICS IOCs in Docker containers; an EPICS monitor logs every PV update (pvname, timestamp, value) to form the trace. 300 s snippet timeout."
agent_features_evaluated:
  models: [Claude 3.5 Sonnet, Claude Sonnet 4 / 4-thinking, Claude Opus 4, Claude Sonnet 4.5, GPT-4o, o3, GPT-5 variants, Gemini 2.5 Pro, Grok-4 / Grok-4-fast / grok-code-fast-1, Devstral Medium, Qwen3 / Qwen3-thinking / Qwen3-coder, Qwen2 / Qwen2.5 / Qwen2.5-coder, Mistral, Mistral-Nemo, Phi-3.5, Athene-v2, Llama 3.3, gpt-oss-120b]
  vision_used: false
  rag_or_memory: none
  planner: none
  tools: [Bluesky/ophyd beamline Python API (VISION Op-cog system prompt)]
  verifier_or_self_debug: none
  guards_or_safety_layer: some
  multi_agent: false
  deterministic_execution: null
transfer_relevant_findings:
  - "Trace alignment on a digital twin gives a semantic correctness signal that text metrics (exact match, CodeBLEU, Levenshtein) miss; the VISION test harness computes all of them side by side"
  - "The same digital twin doubles as a pre-execution validator for live experiments (dry-run before hardware)"
  - "Binary 'accuracy' is deliberately strict (exact sequence + timing); the continuous 'full score' gives partial credit, useful for ranking weaker/open models"
  - "Metric weights and comparators are configurable per channel, so the method ports to other stateful control systems (robotics, industrial automation)"
limitations:
  - "Digital twin captures control logic (PV changes) only, not physics/detector data; scientific outcome quality is not scored"
  - "Small task set (~136) from a single beamline API; ground truth may admit alternative valid implementations (mitigated by multiple expected_code entries and ignore_pvs)"
  - "Per-model scores, run counts and the human-baseline protocol could not be verified from primary text in this session"
related: [vision, lightfall, osprey_als_bl531]
notes: >
  Author list (van der Vleuten, Flores, Mathur, Rakitin, Hopkins, Yager, Tsai) and the '>30 LLMs' / '116 simple + 20 complex'
  figures come from search snippets of the arXiv page/HTML; arXiv itself was egress-blocked, so numeric per-model
  results, confidence intervals, the LLM-judge comparison (if any) and the exact human-baseline size are unverified.
  The GitHub VISION repo contains op_cog_dataset.json (105 entries: 76 simple / 29 flagged complex),
  op_cog_dataset_after_envtrace_paper_fixes.json (157 entries: 136 simple / 21 complex) and an archived original
  (127 entries, 6 complex); none matches 116+20 exactly, so n_tasks=136 follows the paper snippet. Human baseline
  inferred from datasets/op_cog_beamline_scientists/ (bs_1.toml, bs_2.toml, possibly more) and README_TESTING
  'human-based scientist agents'. n_agent_configs=31 is the count of LLM configs enumerated in
  backend/src/hal_beam_com/utils.py, consistent with 'over 30'. The EnvTrace README lists citation as 'to be updated'.
---
id: vision
name: "VISION: A Modular AI Assistant for Natural Human-Instrument Interaction at Scientific User Facilities"
short_name: VISION
year: 2025
venue: "Machine Learning: Science and Technology 6(2) 025051 (2025); arXiv Dec 2024"
authors_short: Mathur et al.
arxiv: "2412.18161"
doi: 10.1088/2632-2153/add9e4
url: https://arxiv.org/abs/2412.18161
code_url: https://github.com/CFN-softbio/VISION
data_url: https://github.com/CFN-softbio/VISION/tree/main/backend/tests/datasets
license: null
status: published
summary: >
  VISION (Virtual Scientific Companion) is a modular LLM-based assistant deployed at the NSLS-II 11-BM CMS X-ray
  scattering beamline. It chains "cognitive blocks" (cogs) for transcription, intent classification, beamline-code
  generation (Op), data analysis (Ana), refinement and scientific Q&A, executing generated Bluesky code on the beamline
  workstation; it demonstrated the first voice-controlled experiment at an X-ray scattering beamline. It is a system
  paper, but the repository ships per-cog test datasets (classifier, op, ana, voice) that later became the EnvTrace benchmark.
benchmark_features:
  evaluation_target: [instrument_control, code_generation, question_answering, data_analysis]
  execution_mode: hybrid
  instruments:
    - {name: "NSLS-II 11-BM CMS (Complex Materials Scattering) beamline, Bluesky-controlled", modality: synchrotron, real_or_simulated: real}
  scientific_domains: [synchrotron X-ray scattering, soft matter, beamline operations]
  n_tasks: null
  n_task_families: 4
  n_instances_or_runs_reported: null
  repetitions_per_task: null
  target_population: "Natural-language (voice or text) requests from beamline users: operate the instrument, add custom functions, analyze data, ask domain questions"
  task_source: expert_curated
  sampling_strategy: "Beamline-scientist-written command/expected-output pairs per cog (classifier_cog_dataset.json, op_cog_dataset.json, ana_cog_dataset.json, voice_cog_dataset.json)"
  metric_types: [success_rate, other, time]
  primary_metric: "Per-cog accuracy (classifier: exact-match accuracy and weighted F1; Op: exact match / CodeBLEU / Levenshtein and later PV-trace match); latency per call"
  scoring_granularity: mixed
  has_human_baseline: null
  has_safety_eval: false
  has_abstention_eval: false
  holdout_or_split_design: null
  leakage_or_contamination_risk: "Datasets public on GitHub; facility-specific API reduces pretraining overlap"
  agents_evaluated: [Claude (default in public repo), GPT-4o, Ollama open models (e.g., qwen2, mistral)]
  n_agent_configs: null
  headline_results:
    - "First voice-controlled experiment at an X-ray scattering beamline; LLM-based operation on the beamline workstation 'with low latency' (abstract)"
    - "Quantitative per-cog accuracy/latency numbers from the paper could not be verified in this session"
  open_source: true
task_features:
  workflow_depth: mixed
  perceptual_demand: none
  reasoning_demand: mixed
  tool_interface: [natural_language, python_api]
  tool_composition: "Voice -> Whisper transcription -> classifier cog routes to Op (code gen), Ana (analysis), Refine, GPCAM/XICAM or chatbot cog; generated Python executed via Bluesky on the workstation"
  quantitative_tolerance: null
  closed_loop_feedback: false
  safety_criticality: medium
  task_taxonomy: [beamline operation (Op), data analysis (Ana), custom function addition, domain-specific chatbot]
sample_environment_features:
  sample_types: [thin films and soft-matter samples at CMS (as referenced in prompts)]
  sample_real_or_simulated: real
  signal_quality_variation: null
  novelty_control: null
  calibration_or_api_state_variation: null
  injected_faults: null
  environment_description: "Frontend GUI on beamline workstation; backend LLM processing on the 'HAL' server; Bluesky execution; optional beamline simulator (EPICS IOCs in Docker) for testing"
agent_features_evaluated:
  models: [Claude 3.5 Sonnet and later Claude models, GPT-4o, Whisper large-v2/v3 (ASR), Ollama models (mistral, qwen2, qwen2.5-coder, llama3.3, etc.)]
  vision_used: false
  rag_or_memory: some
  planner: none
  tools: [Bluesky beamline API, SciAnalysis-style analysis code, gpCAM, Xi-cam]
  verifier_or_self_debug: verifier
  guards_or_safety_layer: some
  multi_agent: true
  deterministic_execution: null
transfer_relevant_findings:
  - "Modular cog design lets models be swapped as they improve; classification-then-specialist routing keeps prompts small and latency low"
  - "The system's test datasets seeded a later execution-trace benchmark (EnvTrace), showing how a deployed assistant can be turned into a benchmark"
limitations:
  - "System/demo paper; evaluation is per-component and not a standardized benchmark"
  - "Single beamline and facility-specific API"
related: [envtrace, lightfall]
notes: >
  Cog names (VOICE, CLASSIFIER, OP, ANA, REFINE, GPCAM, XICAM, VERIFIER) and model lists come from the public repo
  (backend/src/hal_beam_com/utils.py). arXiv and IOP pages were blocked, so the paper's reported accuracy/latency figures,
  number of test prompts, and whether a human baseline exists are unverified (null). License file not seen in repo listing.
  Journal citation from repo README BibTeX. Authors: Shray Mathur, Noah van der Vleuten, Kevin G. Yager, Esther H. R. Tsai.
