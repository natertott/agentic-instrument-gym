summary: >
  A browser-based benchmark of eight web scientific-instrument simulators (SEM, TEM, light microscope, XRD, EDS, APT, FIB,
  SPM) decomposed into 96 subtasks covering sample loading, alignment, parameter tuning, acquisition and result inspection.
  General VLMs, GUI-agent models and agentic frameworks are evaluated at subtask and end-to-end levels; agents complete many
  structured GUI subtasks but struggle with feedback-driven operations and long-horizon workflows.
benchmark_features:
  evaluation_target: [computer_use, instrument_control, simulation_control]
  execution_mode: simulator
