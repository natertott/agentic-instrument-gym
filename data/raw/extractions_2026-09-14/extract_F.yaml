# extract_F.yaml — Microscopy agents (EM / X-ray / optical) and microscopy perception benchmarks
# Compiled 2026-09-14. Sources: arXiv abstracts mirrored on GitHub digest repos (arxiv.org, nature.com,
# science.org, oup.com, biorxiv.org, zenodo.org, huggingface.co, openreview.net, PMC were all blocked by
# the network proxy), GitHub READMEs, project websites' source, and the web-search result snippets.
# Fields that could not be verified against a primary source are null and explained in `notes`.

id: xrm_agent_benchmarks_johnson2026
name: Agentic self-driving microscopy benchmarks support qualification but do not necessarily generalize to unseen tasks
short_name: XRM-AgentBench
year: 2026
venue: arXiv preprint (cs.AI / cond-mat.mtrl-sci), 2026-08-05
authors_short: Johnson & Abshire (Carl Zeiss Research Microscopy Solutions)
arxiv: "2608.05266"
doi: 10.48550/arXiv.2608.05266
url: https://arxiv.org/abs/2608.05266
code_url: https://github.com/natertott/agentic_microscopy_benchmarks_XRM
data_url: https://github.com/natertott/agentic_microscopy_benchmarks_XRM (sweep_results.zip, YAML test-suite definitions, SupplementaryInformation.pdf)
license: MIT (repository)
status: preprint
summary: >
  A benchmark and trace-logging framework for an LLM-agent controller of ZEISS Versa X-ray microscopes
  (simulator plus physical Versa 515/630/730 instruments via the ZEN NavX interface). 53 microscopy
  benchmark tests were run across 105 agent configurations (one-, two- and three-agent graph
  topologies, five LLMs, RAG/context parameters, operational constraints), yielding 1,949 test runs and
  49,109 RAG retrievals. Direct comparison of configurations was informative, but surrogate models
  trained on architecture + test results did not predict performance on held-out tasks.
benchmark_features:
  evaluation_target: [instrument_control, data_analysis, protocol_planning, safety]
  execution_mode: hybrid
  instruments:
    - {name: ZEISS Versa 515/630/730 X-ray microscope (ZEN NavX 3.0 interface), modality: microscopy, real_or_simulated: real}
    - {name: simulated microscope-control software for the same API, modality: microscopy, real_or_simulated: simulated}
  scientific_domains: [X-ray microscopy / micro-CT, materials characterization, instrument automation]
  n_tasks: 53
  n_task_families: 7
  n_instances_or_runs_reported: 1949
  repetitions_per_task: "varies; historical/unbalanced sweep — not every configuration ran every test; repeated runs of same task+config acknowledged as not fully independent"
  target_population: "End-to-end and component-level operation of a self-driving X-ray microscope by an LLM agent (setup, acquisition, segmentation, geometry, recipe generation, safe shutdown)"
  task_source: expert_curated
  sampling_strategy: "Author-designed test suite: 6-test end-to-end workflow, 12 integration workflows, 19 atomic instrument-control tests, 6 geometry/recipe tests, 8 regression/performance tests, 1 image-analysis test, 1 debugging test; plus 5 additional held-out quantitative validation tasks not in the 53"
  metric_types: [success_rate, trace_alignment, cost, time, safety_violations, other]
  primary_metric: "pass/fail per run combining scientific/numerical correctness with trace, file and operational checks; aggregate pass rate per configuration"
  scoring_granularity: binary
  has_human_baseline: false
  has_safety_eval: true
  has_abstention_eval: false
  holdout_or_split_design: "Two surrogate-model validations: configuration-held-out (test identity as feature) vs task-held-out (test identity excluded); plus 5 prospective holdout tasks with numeric tolerances (e.g., stage X 650±100 µm, exposure 5±0.25 s, five pores >1 mm)"
  leakage_or_contamination_risk: "Low for LLM pretraining (proprietary instrument API, private tests); but surrogate models could memorize test identity — authors show test identity is the strongest predictor of pass outcome"
  agents_evaluated: [Claude Sonnet 3.7, Claude Sonnet 4, Claude Opus 4.5, GPT-4.1, GPT-5.1, one-agent, two-agent (supervisor+worker), three-agent (supervisor+instrument worker+image-analysis worker), RAG none/full/pruned]
  n_agent_configs: 105
  headline_results:
    - "105 configurations, 1,949 runs, 49,109 RAG retrievals logged"
    - "One-agent and two-agent systems covered a similar range of pass rates; one-agent used up to ~10,000 fewer tokens per test"
    - "Three-agent topology gave inconsistent improvements and was excluded from the broader sweep"
    - "One-agent pruned-RAG was Pareto-optimal in prospective 53-test comparison; one-agent no-RAG baseline performed approximately as well"
    - "Surrogate ROC-AUC: configuration-held-out L2 logistic 0.54, random forest ~0.78; task-held-out L2 logistic 0.53, random forest 0.55 (near chance)"
    - "Two-agent runs more often exceeded duration/LLM-call/tool-call limits; one-agent runs more often failed trace-based checks"
  open_source: true
task_features:
  workflow_depth: mixed
  perceptual_demand: mixed
  reasoning_demand: mixed
  tool_interface: [python_api, natural_language]
  tool_composition: "Instrument-control tools (stage, source, detector, exposure, recipe), image-analysis/segmentation tools, file generation; multi-agent variants delegate instrument vs image-analysis tools"
  quantitative_tolerance: "Explicit numeric tolerances on held-out tasks (e.g., stage positions ±100–500 µm, source/detector Z ±10 mm, sample dimensions 29 mm ±1–2 mm, exposure 5±0.25 s for ~5000 counts)"
  closed_loop_feedback: true
  safety_criticality: medium
  task_taxonomy: [end-to-end workflow, integration workflows, atomic instrument-control tests, geometry and recipe tests, regression and performance tests, image-analysis test, debugging test]
sample_environment_features:
  sample_types: [physical test samples for X-ray micro-CT (e.g., porous sample with >1 mm pores; ~29 mm cuboid sample), simulated samples]
  sample_real_or_simulated: real
  signal_quality_variation: "Exposure optimization tasks target count levels; otherwise not systematically varied (per available text)"
  novelty_control: "5 prospective holdout tasks outside the 53-test suite; task-held-out surrogate validation"
  calibration_or_api_state_variation: "Runs span simulator and three microscope models; model/prompt/framework/software/hardware versions changed during the study (acknowledged confound)"
  injected_faults: null
  environment_description: "LangGraph-style agent graphs with recursion limit 20–200, temperature 0–1, duration/token/tool-call/safety limits; RAG with episodic top-k 0–5, contextual top-k 0–10, chunk 500–2000, overlap 50–500, similarity threshold 0.1–1.5, context 5k–50k tokens"
agent_features_evaluated:
  models: [Claude Sonnet 3.7, Claude Sonnet 4, Claude Opus 4.5, GPT-4.1, GPT-5.1]
  vision_used: null
  rag_or_memory: varied
  planner: varied
  tools: [microscope control API tools, image analysis tools, recipe/file generation]
  verifier_or_self_debug: varied
  guards_or_safety_layer: some
  multi_agent: true
  deterministic_execution: null
transfer_relevant_findings:
  - "Benchmarks supported qualification, regression testing, diagnosis and direct comparison, but not a task-independent global configuration model"
  - "Task-held-out surrogate models were near chance (AUC 0.53–0.55) — configuration signal did not transfer across task identity"
  - "Test identity > LLM choice > number of agents in feature importance for pass outcome"
  - "More agents did not buy reliability; they shifted failure modes toward resource-limit exhaustion"
limitations:
  - "Historical, unbalanced configuration dataset rather than randomized factorial design"
  - "Not every configuration run on every test; repeats not fully independent"
  - "Versions of models, prompts, framework, software and hardware drifted during the study"
  - "Single instrument family (ZEISS Versa XRM); agent code not released, only benchmark records and analysis scripts"
  - "Claude Opus 4.5 affected by an implementation incompatibility in multi-agent graphs"
related: [tem_agent_wall2025, eaa_du2026, afmbench_mandal2025, emseek_chen2026, xrm_llm_mm2025_johnson]
notes: >
  Details taken from a GitHub-mirrored full-text digest (Miyan0Shiho/arxiv-auto-collector) and the
  abstract mirrored in the CSQianDong arXiv daily reporter, cross-checked with the user's proposal.txt
  (53 tasks / 1,949 runs). Exact per-configuration pass rates and the definition of 'pass' per test
  family were not readable; vision usage (whether images were passed to the LLM) unverified. Instrument
  is an X-ray microscope, not SEM/TEM, but it is the closest full-scale microscopy agent benchmark found.
