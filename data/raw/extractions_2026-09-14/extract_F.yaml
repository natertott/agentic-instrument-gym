summary: >
  A provenance-tracked multi-agent platform (Maestro planner delegating to specialised controllers,
  with Guardian and Scribe agents attaching provenance and uncertainty summaries) that turns raw EM
  images into materials insight: segmentation, crystal-structure determination, property prediction,
  literature comparison and report generation. Evaluated on 20 material systems and five canonical
  tasks; it analyses images rather than controlling the microscope.
