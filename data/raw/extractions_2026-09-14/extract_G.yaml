status: preprint
summary: >
  Framework for safety boundaries and control mechanisms in AI-driven SDLs. Identifies the
  'Syntax-to-Safety Gap' (syntactically correct AI commands whose physical safety implications
  are not captured) as the central deployment challenge and addresses it with three components:
  formally defined Operational Design Domains (ODDs), Control Barrier Functions (CBFs) for
  real-time state-space safety guarantees, and a Transactional Safety Protocol (CRUTD) ensuring
  atomic consistency between digital planning and physical execution. Grounds the framework in
  UniLabOS and the Osprey architecture and evaluates foundation models against LabSafety Bench,
  finding significant safety failures.
schema_axes_proposed:
  - "Syntax-to-Safety Gap (command validity vs physical safety)"
  - "Operational Design Domain (ODD) boundaries"
  - "Control Barrier Functions / continuous state-space monitoring"
  - "Transactional safety protocol (CRUTD) -- atomicity between digital plan and physical execution"
  - "Architectural safety mechanisms as required (not optional) layer, evaluated separately from model-level safety knowledge"
