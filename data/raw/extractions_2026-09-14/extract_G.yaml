id: adesiji_2026_benchmarking_sdls
record_type: framework
name: "Benchmarking self-driving labs"
short_name: "AF/EF SDL benchmarking"
year: 2026
venue: "Digital Discovery 5:14-27 (2026); arXiv preprint Aug 2025"
authors_short: "Adesiji et al. (Adesiji, Wang, Kuo, Brown)"
arxiv: "2508.06642"
doi: "10.1039/D5DD00337G"
url: "https://arxiv.org/abs/2508.06642"
code_url: "https://github.com/kabrownlab/benchmarking"
data_url: "https://github.com/kabrownlab/benchmarking"
license: "MIT (code repo)"
status: published
summary: >
  Review that quantifies how much SDLs accelerate learning by reducing the number of experiments
  needed for a goal. Formalizes two metrics -- acceleration factor (AF: how much faster an
  algorithm reaches a goal than a reference strategy) and enhancement factor (EF: how much
  better the result is at a fixed budget) -- surveys reported values (AF median 6, tending to
  increase with dimensionality; EF varies by >2 orders of magnitude but consistently peaks at
  10-20 experiments per dimension), and runs simulated Bayesian-optimization campaigns showing EF
  depends on the statistical properties of the parameter space while AF depends on its complexity.
schema_axes_proposed:
  - "Acceleration factor (AF): ratio of experiments required by a reference strategy (e.g. random/grid) vs the SDL algorithm to reach a goal"
  - "Enhancement factor (EF): improvement in best-found objective relative to the reference strategy at equal experiment count"
  - "Reference strategy / baseline must be declared (random sampling as default control)"
  - "Dimensionality of the parameter space (AF rises with dimension -- 'blessing of dimensionality')"
  - "Experiments-per-dimension budget (EF peaks at 10-20 experiments per dimension)"
  - "Statistical properties of the objective landscape: contrast (peak-to-median ratio), smoothness/Lipschitz constant, noise level (repo's simulated study varies these)"
  - "Repetition protocol for stochastic optimizers (repo: 100 runs x 100 steps per test function; reports peak EF and step-to-peak)"
