summary: >
  Develops a benchmark and trace-logging framework for LLM agents that control microscopes, to
  reveal how agent-architecture choices affect performance and whether benchmarks predict
  performance on unseen tasks. Evaluates one-, two- and three-agent graph topologies, five LLMs,
  RAG/context parameters and operational constraints across 53 microscopy benchmark tests (105
  agent configurations, 1,949 test runs, 49,109 RAG retrievals). Configurations differ clearly in
  latency, token use, cost and failure mode, but surrogate models trained on architecture +
  results do not reliably predict performance on new tasks: the benchmarks support
  qualification, regression testing, diagnosis and direct comparison, not a task-independent
  global configuration model.
