transfer_relevant_findings:
  - "Any acceleration claim must name its reference strategy; AF/EF give a common language for comparing agents that choose experiments."
  - "Landscape statistics (contrast, smoothness, noise) confound comparisons -- benchmark schemas should record them as environment features."
  - "Because gains scale with dimension and budget, report experiments-per-dimension alongside raw counts."
limitations:
  - "Metrics measure the decision algorithm's sample efficiency, not hardware reliability, safety, or provenance."
  - "Simulation study is 2D and synthetic; literature AF/EF values come from heterogeneous baselines."
  - "Third-party note claims most surveyed SDL studies ignore manufacturability/cost/durability constraints (secondary, unverified)."
