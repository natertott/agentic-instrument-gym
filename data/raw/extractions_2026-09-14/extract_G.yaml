  signal_quality_variation: null
  novelty_control: "generator withheld; fresh instances regenerable"
  calibration_or_api_state_variation: "environment-state (63) and tool-inventory (34) perturbations"
  injected_faults: true
  environment_description: "42 executable MCP sandbox environments across everyday/enterprise domains; tool-runtime-behavior perturbations (34 pairs) inject failures such as critical tool failure."
agent_features_evaluated:
