transfer_relevant_findings:
  - "Paired act/abstain design is the key methodological export: prevents refusal-biased agents from scoring well and is directly applicable to instrument-control tasks (e.g. proceed vs halt when a stage limit or sample state is ambiguous)."
  - "Trigger timing (pre-execution vs runtime) and 'post-hoc abstention' map onto irreversible physical actions in labs."
  - "Scoring on the executed tool trace rather than the model's text avoids 'said refuse but still acted' errors."
  - "CAR separates abstention competence from task competence."
limitations:
  - "Domains are general/enterprise, not scientific instruments; no physical/perceptual demand."
  - "Generator not released; single dataset version; no repetition/seed protocol reported in README."
  - "No human baseline."
related: ["labsafety_bench_2024", "scisafeeval_2024", "zhang_2026_safe_sdl_framework"]
