summary: >
  Psychometric audit of LLM benchmarks motivated by leaderboard inconsistencies and poor
  separability among top models. Proposes PSN-IRT (Pseudo-Siamese Network for Item Response
  Theory), a 4-parameter IRT model trained end-to-end that jointly estimates model ability and
  per-item discrimination, difficulty, guessing rate and feasibility. Applied to 11 benchmarks
  (41,871 items, 12 LLMs via OpenCompass) it reveals varied measurement-quality shortcomings and
  shows that PSN-IRT-selected smaller item subsets align better with human preference.
