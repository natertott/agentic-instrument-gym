summary: >
  Simulation study of whether IRT estimation tools built for human testing remain reliable in
  the AI-benchmark regime (few evaluated models, very many items, skewed/clustered/multimodal
  capability distributions). Using item parameters and ability distributions from six LLM
  benchmarks, three IRT models and four estimators (marginal maximum likelihood, MCMC,
  variational inference, neural pseudo-Siamese) across 18,000 conditions, it finds classical
  estimators can be infeasible at benchmark scale while scalable estimators yield unreliable
  item-level and ranking inferences with small or non-normal model sets, and identifies the
  sample sizes and diagnostics needed for trustworthy use.
