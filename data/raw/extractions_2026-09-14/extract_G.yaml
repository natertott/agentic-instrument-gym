  vision_used: false
  rag_or_memory: null
  planner: "harness-native agent loops (Claude SDK, OpenAI SDK, Google ADK, OpenClaw)"
  tools: ["MCP lookup/verify/commit tools"]
  verifier_or_self_debug: null
  guards_or_safety_layer: null
