  capability-driven taxonomy and synthesizes benchmark task templates and metrics prioritizing
  cost-aware performance, robustness to drift, constraint-violation behaviour and
  reproducibility; outlines open challenges (multi-modal representation, calibrated uncertainty,
  safe exploration, shared benchmark infrastructure).
