summary: >
  Benchmark for multimodal GUI/computer-use agents built on web-based scientific-instrument
  simulators, motivated by the cost, safety risk and irreproducibility of evaluating agents on
  real high-precision instruments. Constructs 96 subtasks across eight instrument simulators
  covering sample loading, alignment, parameter tuning, data acquisition and result inspection;
  evaluates general VLMs, specialized GUI-agent models and agentic frameworks at subtask and
  end-to-end levels. Agents complete many structured GUI subtasks but struggle with
  feedback-driven operations and long-horizon workflows.
