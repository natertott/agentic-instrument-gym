id: agentabstain_2026
record_type: benchmark
name: "AgentAbstain: Do LLM Agents Know When Not to Act?"
short_name: "AgentAbstain"
year: 2026
venue: "arXiv preprint (Jul 2026); venue not stated"
authors_short: "Liu et al. (Xun Liu, Yi Evie Zhang, Vira Kasprova, Parisa Rabbani, Pardis Sadat Zahraei, Tianyu Zhang, Ali Ebrahimpour-Boroojeny, Varun Chandrasekaran; UIUC)"
arxiv: "2607.10059"
doi: null
url: "https://arxiv.org/abs/2607.10059"
code_url: "https://github.com/AntiQuality/agentabstain"
data_url: "https://huggingface.co/datasets/antiquality/agentabstain"
license: "Code MIT; dataset CC BY 4.0"
status: preprint
summary: >
  First systematic evaluation framework for agentic abstention -- the calibrated ability of
  tool-using LLM agents to recognize when NOT to act. Benchmark of 263 paired tasks in 42
  executable MCP sandbox environments (541 tools), where each should-act task has a
  should-abstain twin differing by one controlled perturbation, so always-act or always-refuse
  policies cap at 50% paired accuracy. Generated by the AbstainGen pipeline (deterministic DAG
  replay + cross-family LLM critics; the generator itself is not open-sourced to limit
  contamination). Best of 17 frontier models (Gemini 3.1 Pro) reaches only 59.5% paired accuracy;
  abstention ability is largely independent of task-solving ability, and agents exhibit
  'post-hoc abstention' (executing an irreversible action before recognizing the trigger).
schema_axes_proposed:
  - "Paired should-act / should-abstain task design with a single controlled perturbation"
  - "Perturbation dimension: query/instruction (132 pairs); environment state (63); tool inventory (34); tool runtime behavior (34)"
  - "Abstention trigger timing: pre-execution (visible before any tool call) vs runtime (surfaces through tool returns)"
  - "Eight abstention scenarios: S1 missing critical parameter; S2 ambiguous action specification; S3 conflicting constraints; S4 high-stakes action; S5 insufficient tool capability; S6 critical tool failure; S7 conflicting evidence; S8 emergent risk discovery"
  - "Tool categories: lookup (read-only, 246); verify (validation gates, 119); commit (state-mutating, 176 = 155 write + 21 delete)"
  - "Metrics: Paired Accuracy (primary); Act accuracy; Abstain accuracy; CAR = Conditioned Abstention Rate (abstain accuracy restricted to pairs whose act side was solved)"
  - "Dual scoring signal: deterministic commit check on the tool-call trace + LLM judge on the terminal response (isolates post-hoc abstention)"
  - "Agent harness as a reported variable (Claude SDK, OpenAI SDK, Google ADK, OpenClaw)"
benchmark_features:
  evaluation_target: ["tool-using LLM agents (abstention/act decision)", "agent harnesses"]
  execution_mode: "executable sandbox (MCP environments), automated"
  instruments: []
  scientific_domains: ["general/enterprise tasks (not scientific): retail orders, email, filesystem, banking, phone/messaging, vehicle control, web/CMS, document review, infrastructure control, maps, HR, security/privacy, health portal, trading, flight/travel, calendar, chat, notes, +24 more"]
  n_tasks: 526
  n_task_families: 8
  n_instances_or_runs_reported: null
  repetitions_per_task: null
  target_population: "tool-using LLM agents"
  task_source: "synthetic, generated by AbstainGen pipeline; 3 independent annotators rated 94-98% of sampled tasks well-designed"
  sampling_strategy: "paired perturbation design"
  metric_types: ["paired accuracy", "act accuracy", "abstain accuracy", "conditioned abstention rate"]
  primary_metric: "Paired Accuracy"
  scoring_granularity: "per pair (both sides must pass); per side"
  has_human_baseline: false
  has_safety_eval: true
  has_abstention_eval: true
  holdout_or_split_design: "generator withheld so fresh instances can be regenerated; no train/test split reported"
  leakage_or_contamination_risk: "mitigated by withholding AbstainGen; dataset itself is public"
  agents_evaluated: ["Claude Opus 4.7", "Claude Sonnet 4.6", "Claude Haiku 4.5", "GPT-5.5", "GPT-5", "GPT-5.4", "GPT-5.2", "GPT-5.1", "GPT-4o", "Gemini 3.1 Pro", "Gemini 3 Flash", "GLM-5", "GPT-OSS 120B", "MiniMax M2.5", "DeepSeek V3.2", "DeepSeek V4 Pro", "Kimi K2.5"]
  n_agent_configs: 17
  headline_results:
    - "Gemini 3.1 Pro: paired 59.5% (act 90.5, abstain 65.4, CAR 65.7)"
    - "Claude Opus 4.7: paired 59.4% (act 76.5, abstain 79.0, CAR 77.6)"
    - "Claude Sonnet 4.6: paired 53.4%; GPT-5.5: 52.5%; Claude Haiku 4.5: 49.7%; GPT-5: 49.6%; GPT-5.4: 48.7%; GLM-5: 47.8%; GPT-OSS 120B: 46.2%; GPT-5.2: 42.9%"
    - "Abstention capability largely independent of task-solving capability; post-hoc abstention is a recurring failure mode"
  open_source: true
task_features:
  workflow_depth: "multi-step tool-use episodes (lookup -> verify -> commit)"
  perceptual_demand: "text/tool-return only"
  reasoning_demand: "constraint checking, ambiguity detection, risk recognition from tool outputs"
  tool_interface: ["MCP tool calls (541 tools)"]
  tool_composition: "sequential; commit tools are state-mutating/irreversible"
  quantitative_tolerance: null
  closed_loop_feedback: true
  safety_criticality: "high-stakes / irreversible actions explicitly modelled (S4, S8; delete/write commits)"
  task_taxonomy: ["S1 missing parameter", "S2 ambiguous spec", "S3 conflicting constraints", "S4 high-stakes", "S5 insufficient tool capability", "S6 critical tool failure", "S7 conflicting evidence", "S8 emergent risk"]
