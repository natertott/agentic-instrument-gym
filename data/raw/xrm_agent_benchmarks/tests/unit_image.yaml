tests:

  # ===========================================================================
  # PYTHON CODE EXECUTION
  # ===========================================================================

  - test_id: "python_002"
    name: "Image Statistics with Python"
    description: "Calculate image statistics using custom Python code"
    category: "unit"
    tags: ["image", "python", "statistics"]
    
    user_prompt: |
      Write and execute Python code to:
      1. Acquire an image
      2. Write custom python code to compute the image pixel intensity mean and standard deviation
      3. Print the results
    
    expected:
      expected_tools:
        - "single_acquisition"
        - "execute_python_code"
    
    performance:
      max_llm_calls: 8
      max_tool_calls: 4
    
    timeout_seconds: 120

