  - test_id: "stage_007"
    name: "Multiple Axis Movements"
    description: "Move multiple axes in sequence"
    category: "unit"
    tags: ["instrument", "stage", "movement", "advanced"]
    
    user_prompt: "Move the Sample X, Y, and Z axes to position (0, 0, 0). Then move the Source Z to -100 mm and Detector Z to 100 mm."
    
    expected:
      expected_tools:
        - "move_axis_absolute"
