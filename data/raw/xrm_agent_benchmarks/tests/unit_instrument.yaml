# =============================================================================
# VERSA Test Suite: Instrument Unit Tests
# =============================================================================
# Comprehensive unit tests for individual instrument control operations
# Category: unit
# =============================================================================

tests:
  # ===========================================================================
  # X-RAY SOURCE CONTROL
  # ===========================================================================
  
  - test_id: "xray_001"
    name: "Turn X-rays On/Off Cycle"
    description: "Verify the system can turn X-rays on at specified settings, verify status, then turn off"
    category: "unit"
    tags: ["special", "instrument", "xray", "safety", "core"]
    
    user_prompt: "Turn on the X-rays at 40kV and 3W, even if they are already on. Verify the X-rays are on. Then turn the X-rays off and verify they are off."
    
    expected:
      expected_tools:
        - "turn_xray_on"
        - "is_xray_on"
        - "turn_xray_off"
    
    performance:
      max_duration_ms: 180000
      max_llm_calls: 12
      max_tool_calls: 6
    
    timeout_seconds: 360

  - test_id: "xray_002"
    name: "Check X-ray Status"
    description: "Query X-ray source status without changing it"
    category: "unit"
    tags: ["instrument", "xray", "status", "basic"]
    
    user_prompt: "Check if the X-ray source is currently on or off, and report the current voltage and power settings."
    
    expected:
      expected_tools:
        - "is_xray_on"
    
    performance:
      max_llm_calls: 4
      max_tool_calls: 3
    
    timeout_seconds: 60

